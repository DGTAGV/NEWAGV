<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  

    <title>AGV CHEAT SHEET</title>
    
    <style>
    :root { 
        --primary: #3b82f6; 
        --secondary: #60a5fa; 
        --success: #10b981; 
        --bg: #020617; 
        --card-bg: #0f172a; 
        --text-color: #f8fafc; 
        --border: #1e293b; 
        --result-bg: #1e293b; 
    }

    html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); }
    
    body { 
        font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
        display: flex; 
        justify-content: center; 
        color: var(--text-color); 
        transition: 0.3s; 
    }
    
    .app-card { 
        width: 100%; 
        max-width: 480px; 
        min-height: 100vh; 
        background: var(--card-bg); 
        box-shadow: 0 0 30px rgba(0,0,0,0.5); 
        overflow-y: auto; 
        display: flex;        
        flex-direction: column; 
        border-radius: 0; 
        transition: 0.3s; 
    }
    
    .header { 
        background: linear-gradient(135deg, #020617 0%, #1e293b 100%); 
        color: white; 
        padding: 40px 20px 30px; 
        position: relative; 
        flex-shrink: 0; 
        border-bottom: 1px solid var(--border);
    }
    
    .lang-switch { position: absolute; top: 15px; right: 15px; display: flex; gap: 5px; }
    .lang-btn { 
        border: 1px solid rgba(255,255,255,0.2); 
        background: rgba(255,255,255,0.1); 
        color: #94a3b8; 
        padding: 5px 10px; 
        border-radius: 15px; 
        font-size: 0.8rem; 
        cursor: pointer; 
        backdrop-filter: blur(5px); 
        transition: 0.3s; 
    }
    .lang-btn.active { 
        background: var(--primary); 
        color: white; 
        border: none; 
        font-weight: bold; 
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
    }

    .content { padding: 30px 20px; flex: 1; display: flex; flex-direction: column; }
    
    .input-group { position: relative; margin-bottom: 20px; }
    input { 
        width: 100%; 
        padding: 15px 20px; 
        border: 2px solid var(--border); 
        border-radius: 15px; 
        font-size: 1.1rem; 
        box-sizing: border-box; 
        outline: none; 
        transition: 0.3s; 
        background: #020617; 
        color: white; 
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    
 
    .ad-banner-container {
        width: 100%;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .coupang-link {
        display: flex;
        justify-content: center;
        width: 100%;
        transition: transform 0.1s;
    }
    .coupang-link:active {
        transform: scale(0.98);
    }
    .coupang-img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.4);
    }

    .search-btn { 
        width: 100%; 
        padding: 25px 0; 
        background: linear-gradient(to bottom, #3b82f6, #1d4ed8); 
        color: white; 
        border: none; 
        border-radius: 15px; 
        font-size: 1.5rem; 
        font-weight: 900; 
        cursor: pointer; 
        box-shadow: 0 8px 0 #1e3a8a, 0 15px 20px rgba(0,0,0,0.4); 
        transition: all 0.1s; 
        margin-bottom: 10px;
        position: relative;
        top: 0;
        flex-shrink: 0;
    }
    .search-btn:active { 
        top: 8px; 
        box-shadow: 0 0 0 #1e3a8a, inset 0 2px 5px rgba(0,0,0,0.5); 
    }
    
    #result { 
        margin-top: 25px; 
        padding: 20px; 
        border-radius: 15px; 
        background: var(--result-bg); 
        border-left: 5px solid var(--primary); 
        min-height: 80px; 
        text-align: left; 
        line-height: 1.6; 
        font-size: 1rem; 
        animation: fadeIn 0.5s ease; 
        color: var(--text-color); 
        box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
    }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .footer { 
        padding: 30px 20px; 
        font-size: 0.85rem; 
        color: #64748b; 
        border-top: 1px solid var(--border); 
        text-align: center; 
        margin-top: auto; 
        flex-shrink: 0; 
    }
    .footer a { color: var(--primary); text-decoration: none; font-weight: bold; margin-top: 5px; display: inline-block; }
    
    .lotto-row { 
        margin-bottom: 5px; 
        padding: 5px;       
        background: #020617; 
        border-radius: 8px; 
        box-shadow: 0 2px 5px rgba(0,0,0,0.3); 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        flex-wrap: wrap; 
        gap: 3px; 
        border: 1px solid var(--border);
    }
    
    .lotto-ball { 
        width: 33px; height: 33px; 
        border-radius: 50%; 
        display: inline-flex; justify-content: center; align-items: center; 
        color: white; font-weight: bold; font-size: 1.2rem; 
        text-shadow: 1px 1px 2px rgba(0,0,0,0.8); 
        box-shadow: inset 2px 2px 5px rgba(255,255,255,0.2), inset -3px -3px 5px rgba(0,0,0,0.5), 1px 1px 3px rgba(0,0,0,0.5);
        border: 1px solid rgba(0,0,0,0.3); 
    }
    
    .plus-sign { font-weight: bold; color: #64748b; margin: 0 2px; font-size: 1rem; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <div class="lang-switch">
            <button id="btn-ko" class="lang-btn active" onclick="setLang('ko')">🇰🇷 KO</button>
            <button id="btn-en" class="lang-btn" onclick="setLang('en')">🇺🇸 EN</button>
        </div>
        <h2 id="title" style="margin:0; font-size: 1.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">AGV 알람 코드 조회</h2>
        <p id="subtitle" style="margin:5px 0 0; opacity: 0.7; font-size: 0.9rem;">Smart Port Maintenance Assistant</p>
    </div>

    <div class="content">
        <div class="input-group" style="margin-bottom: 20px;">
            <input type="number" id="errorCode" placeholder="코드 1~3자리 입력" onkeypress="if(event.keyCode==13) check()" onfocus="this.value=''">
        </div>

        <div class="ad-banner-container">
            <a href="https://link.coupang.com/a/gc9m1nTDz2" target="_blank" referrerpolicy="unsafe-url" class="coupang-link">
               
                <img src="banner.png" alt="쿠팡 배너" class="coupang-img">
            </a>
            <p style="margin-top: 5px; font-size: 10px; color: #475569; text-align: center; margin-bottom: 0;">
                쿠팡 파트너스 활동 수수료를 제공받음
            </p>
        </div>

        <button class="search-btn" onclick="check()" id="search-text">조회하기</button>
        
        <div id="result">💡 코드를 입력하고 조회 버튼을 누르세요.</div>
    </div>

    <div class="footer">
        <span id="footer-text">오류 및 건의사항 문의</span><br>
        <a href="mailto:TOKIABUJI@NAVER.COM">📧 TOKIABUJI@NAVER.COM</a>
    </div>
</div>

<script>
    

    let currentLang = 'ko';

    const uiText = {
        ko: { 
            title: "AGV 알람 코드 조회", search: "조회하기", placeholder: "코드 1~3자리 입력", 
            footer: "오류 및 건의사항 문의", empty: "💡 코드를 입력해 주세요.", 
            unknown: "❌ 해당 코드를 찾을 수 없으니 다시 확인해 주세요.", 
            lottoTitle: "🎰 <b>행운의 로또 번호</b><br>",
            pensionTitle: "🎯 <b>연금복권 720 추천 번호</b><br>" 
        },
        en: { 
            title: "AGV CHEAT SHEET", search: "SEARCH", placeholder: "Enter 1~3-digit Code", 
            footer: "Errors & Suggestions", empty: "💡 Please enter a code.", 
            unknown: "❌ Code not found. Please check and try again.", 
            lottoTitle: "🎰 <b>Euro Lucky Numbers</b><br>",
            pensionTitle: "🎯 <b>Pension Lottery 720</b><br>"
        }
    };

    const agvData = {
       "1": { ko: "⚠️ <b>오류: 그리스 윤활 전원 공급 장치 VCU 출력 오류</b><br>✅ 조치: 자동 그리스 윤활 시스템의 전원 공급 장치 제어에 진단 결함이 있습니다. VCU에서 모듈로 연결되는 배선을 점검하고 시스템에 결함이나 손상이 있는지 확인하십시오. 모든 것이 정상이면 AGV를 재시작하고 반복되는 오류가 있는지 확인하십시오.", en: "⚠️ <b>Error: Grease lubrication power supply VCU output error</b><br>✅ Action: There is a diagnostics fault on the control of the power supply of the automatic grease lubrication system. Check the wiring from VCU to the module and check the system for faults or damaged. If everything is OK, restart the AGV and check for recurring errors." },
  "3": { ko: "⚠️ <b>오류: 전기 캐비닛 도어 열림</b><br>✅ 조치: 전기 캐비닛 도어가 하나 이상 열려 있습니다.", en: "⚠️ <b>Error: Door e-cabinet open</b><br>✅ Action: One or more e-cabinet doors are opened." },
  "5": { ko: "⚠️ <b>오류: 구동부 냉각수 수위 너무 낮음</b><br>✅ 조치: 구동 시스템 냉각용 팽창 탱크의 냉각수 수위가 너무 낮습니다. 적절한 냉각수를 최대 수위까지 보충하십시오.", en: "⚠️ <b>Error: Traction coolant level too low</b><br>✅ Action: The coolant level of the expansion tank for cooling the traction system is too low. Top up the tank to maximum level with suitable coolant." },
  "18": { ko: "⚠️ <b>오류: 유압유 레벨 낮음</b><br>✅ 조치: 유압유 수위가 낮습니다. 유압 시스템에 누출이 있는지 확인하십시오. 적합한 유압유를 최대 수위까지 보충하십시오.", en: "⚠️ <b>Error: Hydraulic oil level low</b><br>✅ Action: The hydraulic oil level is low. Check the hydraulic system for leaks. Top up the tank to maximum level with suitable hydraulic oil." },
  "19": { ko: "⚠️ <b>오류: 유압유 압력 낮음</b><br>✅ 조치: 유압 시스템 압력이 너무 낮습니다. 펌프 및 인버터 기능, 누출, 어큐뮬레이터 질소 압력, 결함 있는 센서 및 밸브가 있는지 시스템을 점검하십시오.", en: "⚠️ <b>Error: Hydraulic oil pressure low</b><br>✅ Action: Hydraulic system pressure is too low. Check the system for functionality of the pump and inverter, leaks, accumulator nitrogen pressure, faulty sensors and valves." },
  "22": { ko: "⚠️ <b>오류: 테스트 소프트웨어로 AGV 작동 중</b><br>✅ 조치: AGV가 테스트 소프트웨어 버전으로 작동 중입니다. 의도한 것이 아니라면 어떤 소프트웨어가 테스트용인지 확인하십시오. VCU, HMI, 내비게이션 또는 CAN NAV의 버전번호중 3번째자리 번호가 0이 아니면 테스트 소프트웨어입니다. 계속 작동하기 전에 테스트용이 아닌 소프트웨어로 업데이트하십시오.", en: "⚠️ <b>Error: AGV operational with test software</b><br>✅ Action: The AGV is in operation with a test software version. If this is not intended, check which software is test software. If the third version identification number of the VCU, HMI, Navigation or CAN NAV is not equal to 0, this is test software. Update this to a non-test software before continuing operation." },
  "23": { ko: "⚠️ <b>오류: 유압유 레벨 너무 높음</b><br>✅ 조치: 유압유 수위가 너무 높습니다. 탱크를 최대 수위 선까지 비우십시오.", en: "⚠️ <b>Error: Hydraulic oil level too high</b><br>✅ Action: The hydraulic oil level is too high. Empty the tank to maximum level." },
  "24": { ko: "⚠️ <b>오류: 유압유 압력 형성 안 됨 또는 느림</b><br>✅ 조치: 유압 시스템이 제때 압력을 높이지 못합니다. 펌프 및 인버터 기능, 누출, 어큐뮬레이터 질소 압력, 결함 있는 센서 및 밸브가 있는지 시스템을 점검하십시오.", en: "⚠️ <b>Error: Hydraulic oil no pressure building or slowly</b><br>✅ Action: The hydraulic system is unable to pressurise in time. Check the hydraulic system for functionality of the pump and inverter, leaks, accumulator nitrogen pressure, faulty sensors and valves." },
  "25": { ko: "⚠️ <b>오류: 유압유 온도 높음</b><br>✅ 조치: 유압유 온도가 높습니다. 유체 순환과 냉각 팬이 정상 작동하는지 점검하십시오.", en: "⚠️ <b>Error: Hydraulic oil temperature high</b><br>✅ Action: The hydraulic oil temperature is high. Check the fluid circulation and the functionality of the cooling fans." },
  "26": { ko: "⚠️ <b>오류: 유압유 온도 너무 높음</b><br>✅ 조치: 유압유 온도가 너무 높습니다. 유체 순환과 냉각 팬이 정상 작동하는지 점검하십시오.", en: "⚠️ <b>Error: Hydraulic oil temperature too high</b><br>✅ Action: The hydraulic oil temperature is too high. Check the fluid circulation and the functionality of the cooling fans." },
  "27": { ko: "⚠️ <b>오류: 유압유 리턴 필터 오염</b><br>✅ 조치: 유압유 리턴 필터가 오염되었습니다. 필터를 교체하십시오.", en: "⚠️ <b>Error: Hydraulic oil return filter polluted</b><br>✅ Action: The hydraulic oil return filter is polluted. Replace the filter." },
  "28": { ko: "⚠️ <b>오류: 유압유 공급 필터 오염</b><br>✅ 조치: 유압유 공급 필터가 오염되었습니다. 필터를 교체하십시오.", en: "⚠️ <b>Error: Hydraulic oil supply filter polluted</b><br>✅ Action: The hydraulic oil supply filter is polluted. Replace the filter." },
  "29": { ko: "⚠️ <b>오류: 범퍼 바이패스 스위치 활성화됨</b><br>✅ 조치: 범퍼 무시 기능이 활성화되어 있어 범퍼 센서가 작동된 상태에서도 AGV를 최대 속도 0.1 m/s로 수동 운전할 수 있습니다.", en: "⚠️ <b>Error: Bumper bypass switch active</b><br>✅ Action: The bumper override is active which, with an activated bumper sensor, still allows manual driving with the AGV at maximum speed of 0.1 m/s." },
  "30": { ko: "⚠️ <b>오류: 유압유 레벨 너무 낮음</b><br>✅ 조치: 유압유 수위가 너무 낮습니다. 수위가 복구될 때까지 시스템을 사용할 수 옵습니다. 유압 시스템의 누출을 점검하십시오. 저장소의 오일 양을 점검하고 적합한 오일을 보충하십시오.", en: "⚠️ <b>Error: Hydraulic oil level too low</b><br>✅ Action: The hydraulic oil level is too low. The system cannot be used until the hydraulic oil level is restored. Check the hydraulic system for leaks. Check the oil level in the reservoir and top up with suitable oil." },
  "31": { ko: "⚠️ <b>오류: 전면 좌측 범퍼 센서 눌림</b><br>✅ 조치: 전면 좌측 범퍼 센서가 더 이상 적절한 물체를 감지하지 못합니다. AGV에 손상이 없는지 점검하고, 오류 보고인 경우 범퍼 메커니즘과 관련된 센서 조정을 확인하십시오.", en: "⚠️ <b>Error: Bumper sensor front left pressed</b><br>✅ Action: The bumper sensor front left no longer sees a suitable object. Check the AGV for damage, if this is a false report, check the adjustment of the sensor in relation to the bumper mechanism." },
  "32": { ko: "⚠️ <b>오류: 전면 우측 범퍼 센서 눌림</b><br>✅ 조치: 전면 우측 범퍼 센서가 더 이상 적절한 물체를 감지하지 못합니다. AGV의 손상을 점검하십시오. 오류 보고인 경우 범퍼 메커니즘과 관련된 센서 조정을 확인하십시오.", en: "⚠️ <b>Error: Bumper sensor front right pressed</b><br>✅ Action: The bumper sensor front right no longer sees a suitable object. Check the AGV for damage. If this is a false report, check the adjustment of the sensor in relation to the bumper mechanism." },
  "33": { ko: "⚠️ <b>오류: 후면 좌측 범퍼 센서 눌림</b><br>✅ 조치: 후면 좌측 범퍼 센서가 더 이상 적절한 물체를 감지하지 못합니다. AGV의 손상을 점검하십시오. 오류 보고인 경우 범퍼 메커니즘과 관련된 센서 조정을 확인하십시오.", en: "⚠️ <b>Error: Bumper sensor rear left pressed</b><br>✅ Action: The bumper sensor rear left no longer sees a suitable object. Check the AGV for damage. If this is a false report, check the adjustment of the sensor in relation to the bumper mechanism." },
  "34": { ko: "⚠️ <b>오류: 후면 우측 범퍼 센서 눌림</b><br>✅ 조치: 후면 우측 범퍼 센서가 더 이상 적절한 물체를 감지하지 못합니다. AGV의 손상을 점검하십시오. 오류 보고인 경우 범퍼 메커니즘과 관련된 센서 조정을 확인하십시오.", en: "⚠️ <b>Error: Bumper sensor rear right pressed</b><br>✅ Action: The bumper sensor rear right no longer sees a suitable object. Check the AGV for damage. If this is a false report, check the adjustment of the sensor in relation to the bumper mechanism." },
  "35": { ko: "⚠️ <b>오류: 전면 좌측 비상 정지 버튼 눌림</b><br>✅ 조치: 전면 좌측 비상 정지 버튼이 눌렸습니다. 비상 정지가 눌린 원인을 점검하고 상황이 안전해지면 AGV를 리셋하십시오.", en: "⚠️ <b>Error: Emergency stop button front left pressed</b><br>✅ Action: The emergency stop button front left has been pressed. Check the reason for pressing the emergency stop and reset the AGV when the situation is safe again." },
  "36": { ko: "⚠️ <b>오류: 전면 우측 비상 정지 버튼 눌림</b><br>✅ 조치: 전면 우측 비상 정지 버튼이 눌렸습니다. 비상 정지가 눌린 원인을 점검하고 상황이 안전해지면 AGV를 리셋하십시오.", en: "⚠️ <b>Error: Emergency stop button front right pressed</b><br>✅ Action: The emergency stop button front right has been pressed. Check the reason for pressing the emergency stop and reset the AGV when the situation is safe again." },
  "37": { ko: "⚠️ <b>오류: 중간 좌측 비상 정지 버튼 눌림</b><br>✅ 조치: 중간 좌측 비상 정지 버튼이 눌렸습니다. 비상 정지가 눌린 원인을 점검하고 상황이 안전해지면 AGV를 리셋하십시오.", en: "⚠️ <b>Error: Emergency stop button middle left pressed</b><br>✅ Action: The emergency stop button middle left has been pressed. Check the reason for pressing the emergency stop and reset the AGV when the situation is safe again." },
  "38": { ko: "⚠️ <b>오류: 중간 우측 비상 정지 버튼 눌림</b><br>✅ 조치: 중간 우측 비상 정지 버튼이 눌렸습니다. 비상 정지가 눌린 원인을 점검하고 상황이 안전해지면 AGV를 리셋하십시오.", en: "⚠️ <b>Error: Emergency stop button middle right pressed</b><br>✅ Action: The emergency stop button middle right has been pressed. Check the reason for pressing the emergency stop and reset the AGV when the situation is safe again." },
  "39": { ko: "⚠️ <b>오류: 후면 좌측 비상 정지 버튼 눌림</b><br>✅ 조치: 후면 좌측 비상 정지 버튼이 눌렸습니다. 비상 정지가 눌린 원인을 점검하고 상황이 안전해지면 AGV를 리셋하십시오.", en: "⚠️ <b>Error: Emergency stop button rear left pressed</b><br>✅ Action: The emergency stop button rear left has been pressed. Check the reason for pressing the emergency stop and reset the AGV when the situation is safe again." },
  "40": { ko: "⚠️ <b>오류: 후면 우측 비상 정지 버튼 눌림</b><br>✅ 조치: 후면 우측 비상 정지 버튼이 눌렸습니다. 비상 정지가 눌린 원인을 점검하고 상황이 안전해지면 AGV를 리셋하십시오.", en: "⚠️ <b>Error: Emergency stop button rear right pressed</b><br>✅ Action: The emergency stop button rear right has been pressed. Check the reason for pressing the emergency stop and reset the AGV when the situation is safe again." },
  "41": { ko: "⚠️ <b>오류: MCD 비상 정지 버튼 눌림</b><br>✅ 조치: MCD 비상 정지 버튼이 눌렸거나 전기 캐비닛 측면의 블라인드 플러그가 제거되었습니다. 비상 정지가 눌리거나 블라인드 플러그가 제거된 원인을 점검하고 상황이 안전해지면 AGV를 리셋하십시오.", en: "⚠️ <b>Error: Emergency stop button MCD pressed</b><br>✅ Action: The emergency stop button MCD has been pressed or the blindplug on the side of the e-cabinet has been removed. Check the reason for pressing the emergency stop or the removal of the blindplug and reset the AGV when the situation is safe again." },
  "42": { ko: "⚠️ <b>오류: 전면 좌측 조향 밸브 오류</b><br>✅ 조치: 전면 좌측 조향 밸브 제어에 진단 결함이 있습니다. VCU에서 모듈로 가는 배선을 점검하고 시스템 결함이나 손상이 있는지 점검하십시오. 이상이 없으면 AGV를 재시작하고 반복적인 오류가 있는지 확인하십시오.", en: "⚠️ <b>Error: Valve steering front left error</b><br>✅ Action: There is a diagnostics fault on the control of the steering valve front left. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
  "43": { ko: "⚠️ <b>오류: 전면 우측 조향 밸브 오류</b><br>✅ 조치: 전면 우측 조향 밸브 제어에 진단 결함이 있습니다. VCU에서 모듈로 가는 배선을 점검하고 시스템 결함이나 손상이 있는지 점검하십시오. 이상이 없으면 AGV를 재시작하고 반복적인 오류가 있는지 확인하십시오.", en: "⚠️ <b>Error: Valve steering front right error</b><br>✅ Action: There is a diagnostics fault on the control of the steering valve front right. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
  "44": { ko: "⚠️ <b>오류: 후면 좌측 조향 밸브 오류</b><br>✅ 조치: 후면 좌측 조향 밸브 제어에 진단 결함이 있습니다. VCU에서 모듈로 가는 배선을 점검하고 시스템 결함이나 손상이 있는지 점검하십시오. 이상이 없으면 AGV를 재시작하고 반복적인 오류가 있는지 확인하십시오.", en: "⚠️ <b>Error: Valve steering rear left error</b><br>✅ Action: There is a diagnostics fault on the control of the steering valve rear left. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
  "45": { ko: "⚠️ <b>오류: 후면 우측 조향 밸브 오류</b><br>✅ 조치: 후면 우측 조향 밸브 제어에 진단 결함이 있습니다. VCU에서 모듈로 가는 배선을 점검하고 시스템 결함이나 손상이 있는지 점검하십시오. 이상이 없으면 AGV를 재시작하고 반복적인 오류가 있는지 확인하십시오.", en: "⚠️ <b>Error: Valve steering rear right error</b><br>✅ Action: There is a diagnostics fault on the control of the steering valve rear right. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
  "49": { ko: "⚠️ <b>오류: 내비게이션 라이선스 키를 찾을 수 없음</b><br>✅ 조치: 내비게이션 시스템에 입력된 라이선스 키가 없습니다. AGV의 자동 주행이 허용되지 않습니다. 유효한 라이선스 키를 시스템에 입력하고 AGV를 재시작하십시오.", en: "⚠️ <b>Error: Navigation license key not found</b><br>✅ Action: There is no license key entered in the navigation system. Automatic driving of the AGV is not allowed. Please enter a valid license key into the system and restart the AGV." },
  "50": { ko: "⚠️ <b>오류: 내비게이션 라이선스 키가 유효하지 않음</b><br>✅ 조치: 내비게이션 시스템에 입력된 라이선스 키가 유효하지 않습니다. AGV의 자동 주행이 허용되지 않습니다. 유효한 라이선스 키를 입력 후 재시작하거나 이 문제에 대해 VDL 지원팀에 문의하십시오.", en: "⚠️ <b>Error: Navigation license key invalid</b><br>✅ Action: The license key entered in the navigation system is invalid. Automatic driving of the AGV is not allowed. Please enter a valid license key into the system and restart the AGV or contact VDL for support on this issue." },
  "51": { ko: "⚠️ <b>오류: 내비게이션 통신 카운터 오류</b><br>✅ 조치: 내비게이션 소프트웨어의 CAN 수명 카운터가 예상대로 작동하지 않습니다. AGV를 리셋하십시오. 오류가 지속되면 재시작하십시오. CAN 버스(품질), 배선 및 모듈 작동을 점검하십시오.", en: "⚠️ <b>Error: Communication navigation counter error</b><br>✅ Action: The CAN lifecounter of the Navigation software is not functioning as expected. Reset the AGV. If the error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "52": { ko: "⚠️ <b>오류: 전면 구동 인버터 경고</b><br>✅ 조치: 전면 구동 인버터에서 경고를 전송합니다. 경고 분석 및 이 결함에 대한 자세한 내용은 적절한 진단 도구 및 공급업체의 문제 해결 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Traction inverter front warning</b><br>✅ Action: The traction inverter front transmits a warning. Refer to appropriate diagnostic tools and supplier troubleshooting manual for analysis on the warning and more information on this fault." },
  "53": { ko: "⚠️ <b>오류: 전면 구동 인버터 오류</b><br>✅ 조치: 전면 구동 인버터가 오류를 전송합니다. 분석 및 이 결함에 대한 자세한 내용은 적절한 진단 도구 및 공급업체의 문제 해결 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Traction inverter front error</b><br>✅ Action: The traction inverter front transmits an error. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for analysis on the warning and more information on this fault." },
  "54": { ko: "⚠️ <b>오류: 후면 구동 인버터 경고</b><br>✅ 조치: 후면 구동 인버터에서 경고를 전송합니다. 경고 분석 및 결함에 대한 자세한 내용은 적절한 진단 도구 및 공급업체의 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Traction inverter rear warning</b><br>✅ Action: The traction inverter rear transmits a warning. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for analysis on the warning and more information on this fault." },
  "55": { ko: "⚠️ <b>오류: 후면 구동 인버터 오류</b><br>✅ 조치: 후면 구동 인버터가 오류를 전송합니다. 경고 분석 및 결함에 대한 자세한 내용은 적절한 진단 도구 및 공급업체의 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Traction inverter rear error</b><br>✅ Action: The traction inverter rear transmits an error. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for analysis on the warning and more information on this fault." },
  "58": { ko: "⚠️ <b>오류: 양쪽 구동 인버터 오류</b><br>✅ 조치: 양쪽 구동 인버터에서 오류를 전송하고 있습니다. AGV가 더 이상 주행할 수 없습니다. 경고 분석 및 결함에 대한 정보는 진단 도구 및 공급업체의 문제 해결 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Traction inverter both error</b><br>✅ Action: Both traction inverters are transmitting an error. The AGV is not able to drive anymore. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for analysis on the warning and more information on this fault." },
  "60": { ko: "⚠️ <b>오류: 구동 냉각 펌프 인버터 오류</b><br>✅ 조치: 구동 시스템 냉각액 펌프용 인버터 오류가 감지되었습니다. 구동 시스템의 냉각수 순환이 없습니다. 오류가 해결될 때까지 AGV는 경로 끝에서 멈춥니다. 인버터 결함 및 손상을 확인하십시오.", en: "⚠️ <b>Error: Traction cooling pump inverter error</b><br>✅ Action: An error on the inverter for the cooling fluid pump for the traction system has been detected. There is no cooling fluid circulation in the traction system anymore. The AGV will stop at the end of its route  until this error is resolved. Check the inverter for faults and damage. Refer to the supplier's (troubleshooting) manual and appropriate diagnostic tools for more information on this fault." },
  "61": { ko: "⚠️ <b>오류: 전면 좌측 조향각 인코더 오류</b><br>✅ 조치: 전면 좌측 조향각 인코더가 예상과 다른 값을 제공합니다. CAN 버스(품질), 배선, 모듈 작동, 인코더와 샤프트 간의 기계적 결합을 확인하고 차축의 손상 여부를 점검하십시오.", en: "⚠️ <b>Error: Steering angle encoder front left error</b><br>✅ Action: The steering angle encoder front left gives a different value than expected. Check CAN bus (quality), wiring, module functioning, mechanical coupling between encoder and shaft, and check the axle for damage." },
  "62": { ko: "⚠️ <b>오류: 전면 우측 조향각 인코더 오류</b><br>✅ 조치: 전면 우측 조향각 인코더가 예상과 다른 값을 제공합니다. CAN 버스(품질), 배선, 모듈 작동, 인코더와 샤프트 간의 기계적 결합을 확인하고 차축 손상을 점검하십시오.", en: "⚠️ <b>Error: Steering angle encoder front right error</b><br>✅ Action: The steering angle encoder front right gives a different value than expected. Check CAN bus (quality), wiring, module functioning, mechanical coupling between encoder and shaft, and check the axle for damage." },
  "63": { ko: "⚠️ <b>오류: 후면 좌측 조향각 인코더 오류</b><br>✅ 조치: 후면 좌측 조향각 인코더가 예상과 다른 값을 제공합니다. CAN 버스(품질), 배선, 모듈 작동, 인코더와 샤프트 간 기계적 결합 및 차축 손상 여부를 확인하십시오.", en: "⚠️ <b>Error: Steering angle encoder rear left error</b><br>✅ Action: The steering angle encoder rear left gives a different value than expected. Check CAN bus (quality), wiring, module functioning, mechanical coupling between encoder and shaft, and check the axle for damage." },
  "64": { ko: "⚠️ <b>오류: 후면 우측 조향각 인코더 오류</b><br>✅ 조치: 후면 우측 조향각 인코더가 예상과 다른 값을 제공합니다. CAN 버스(품질), 배선, 모듈 작동, 인코더와 샤프트 간 기계적 결합 및 차축 손상 여부를 확인하십시오.", en: "⚠️ <b>Error: Steering angle encoder rear right error</b><br>✅ Action: The steering angle encoder rear right gives a different value than expected. Check CAN bus (quality), wiring, module functioning, mechanical coupling between encoder and shaft, and check the axle for damage." },
  "65": { ko: "⚠️ <b>오류: 전면 좌측 속도 인코더 오류</b><br>✅ 조치: 전면 좌측 속도 인코더가 예상과 다른 값을 제공합니다. 진단 도구로 인코더 기능을 확인하고 샤프트와의 기계적 연결 및 케이블 배선을 점검하십시오.", en: "⚠️ <b>Error: Speed encoder front left error</b><br>✅ Action: The front left speed encoder gives a value different than expected. Check the functionality of encoder using appropriate diagnostic tools, check the mechanical connection to the shaft and the cabling." },
  "66": { ko: "⚠️ <b>오류: 전면 우측 속도 인코더 오류</b><br>✅ 조치: 전면 우측 속도 인코더가 예상과 다른 값을 제공합니다. 진단 도구로 인코더 기능을 확인하고 샤프트와의 기계적 연결 및 케이블 배선을 점검하십시오.", en: "⚠️ <b>Error: Speed encoder front right error</b><br>✅ Action: The front right speed encoder gives a value different than expected. Check the functionality of encoder using appropriate diagnostic tool, check the mechanical connection to the shaft and the cabling." },
  "67": { ko: "⚠️ <b>오류: 후면 좌측 속도 인코더 오류</b><br>✅ 조치: 후면 좌측 속도 인코더가 예상과 다른 값을 제공합니다. 진단 도구로 인코더 기능을 확인하고 샤프트와의 기계적 연결 및 케이블 배선을 점검하십시오.", en: "⚠️ <b>Error: Speed encoder rear left error</b><br>✅ Action: The rear left speed encoder gives a value different than expected. Check the functionality of encoder using appropriate diagnostic tools, check the mechanical connection to the shaft and the cabling." },
  "68": { ko: "⚠️ <b>오류: 후면 우측 속도 인코더 오류</b><br>✅ 조치: 후면 우측 속도 인코더가 예상과 다른 값을 제공합니다. 진단 도구로 인코더 기능을 확인하고 샤프트와의 기계적 연결 및 케이블 배선을 점검하십시오.", en: "⚠️ <b>Error: Speed encoder rear right error</b><br>✅ Action: The rear right speed encoder gives a value different than expected. Check the functionality of encoder using appropriate diagnostic tools, check the mechanical connection to the shaft and the cabling." },
  "79": { ko: "⚠️ <b>오류: 2개 이상의 속도 인코더 오류</b><br>✅ 조치: 여러 속도 인코더가 예상과 다른 값을 제공합니다. 진단 도구로 인코더의 기능을 확인하고 케이블 배선을 점검하십시오.", en: "⚠️ <b>Error: Speed encoder two or more error</b><br>✅ Action: several speed encoders give a different value than expected. Check the functionality of encoders using appropriate diagnostic tools and check cabling." },
  "80": { ko: "⚠️ <b>오류: AGV 과속</b><br>✅ 조치: AGV가 최대 속도보다 빠르게 주행하고 있습니다. CAN 버스(품질), 구동 인버터의 배선 및 작동을 점검하십시오. 내비게이션 로그 파일을 수집하고 VDL에 문의하십시오.", en: "⚠️ <b>Error: AGV overspeed</b><br>✅ Action: The AGV is driving faster than the maximum speed. Check the CAN bus (quality), wiring and functioning of the traction inverters. Collect navigation logfiles and contact VDL." },
  "81": { ko: "⚠️ <b>오류: AGV 비상 정지 안정성 문제</b><br>✅ 조치: AGV의 조향각과 속도의 조합으로 불안정한 상황이 발생했습니다. AGV가 비상 정지를 수행했습니다. AGV의 조향 정렬을 점검하고 필요시 수정하십시오.", en: "⚠️ <b>Error: AGV emergency stop stability</b><br>✅ Action: The steering angle of the AGV combined with the speed resulted in an unstable situation. The AGV has made an emergency stop. Check the steering alignment of the AGV and correct it if necessary." },
  "82": { ko: "⚠️ <b>오류: 홀드 투 런 기능에 의해 AGV 정지됨</b><br>✅ 조치: MCD 수동 조작 시 입력한 속도보다 AGV가 충분히 멈추지 않아 정지됨. CAN 버스(품질), 배선, 트랙션 인버터 및 브레이크 작동을 점검하십시오.", en: "⚠️ <b>Error: AGV stopped by hold to run</b><br>✅ Action: The AGV did not come to a stop fast enough in manual mode after dropping speed set point of the MCD. Check the CAN bus (quality), wiring and functioning of the traction inverters and brakes." },
  "83": { ko: "⚠️ <b>오류: AGV 리포지셔닝 실패</b><br>✅ 조치: AGV가 주어진 정지 지점에서 허용 오차 내로 위치를 수정하지 못했습니다. 수동으로 AGV를 정지 지점에 위치시키고 작업을 재개하십시오.", en: "⚠️ <b>Error: AGV repositioning failed</b><br>✅ Action: The AGV is unable to correct the position within tolerance at the given stopping point. Manually position the AGV at the stopping point and resume operation." },
  "84": { ko: "⚠️ <b>오류: 전면 비상 정지 버튼 안전 회로 눌림</b><br>✅ 조치: 전면 비상 정지 버튼의 안전 회로가 차단되었습니다. 어떤 비상 정지가 눌렸는지, 원인이 무엇인지 확인하십시오. 안전해지면 AGV를 리셋하십시오.", en: "⚠️ <b>Error: Emergency stop button safety circuit front pressed</b><br>✅ Action: The safety circuit of the front emergency stop buttons is interrupted. Check which emergency stop has been pressed and the reason for pressing the emergency stop or why this circuit has been interrupted. Reset the AGV when the situation is safe again." },
  "85": { ko: "⚠️ <b>오류: 후면 비상 정지 버튼 안전 회로 눌림</b><br>✅ 조치: 후면 비상 정지 버튼의 안전 회로가 차단되었습니다. 어떤 비상 정지가 눌렸는지 확인하고 안전해지면 AGV를 리셋하십시오.", en: "⚠️ <b>Error: Emergency stop button safety circuit rear pressed</b><br>✅ Action: The safety circuit of the rear emergency stop buttons is interrupted. Check which emergency stop has been pressed and the reason for pressing the emergency stop or why this circuit has been interrupted. Reset the AGV when the situation is safe again." },
  "86": { ko: "⚠️ <b>오류: 중간 좌측 비상 정지 버튼 안전 회로 눌림</b><br>✅ 조치: 중앙 좌측 비상 정지 버튼의 안전 회로가 차단되었습니다. 차단 원인을 점검하고 상황이 안전해지면 AGV를 리셋하십시오.", en: "⚠️ <b>Error: Emergency stop button safety circuit middle left pressed</b><br>✅ Action: The safety circuit of the emergency stop button centre left is interrupted. Check the reason for pressing the emergency stop or why this circuit is interrupted. Reset the AGV when the situation is safe again." },
  "87": { ko: "⚠️ <b>오류: 중간 우측 비상 정지 버튼 안전 회로 눌림</b><br>✅ 조치: 중앙 우측 비상 정지 버튼의 안전 회로가 차단되었습니다. 차단 원인을 점검하고 상황이 안전해지면 AGV를 리셋하십시오.", en: "⚠️ <b>Error: Emergency stop button safety circuit middle right pressed</b><br>✅ Action: The safety circuit of the emergency stop button centre right is interrupted. Check the reason for pressing the emergency stop or why this circuit is interrupted. Reset the AGV when the situation is safe again." },
  "88": { ko: "⚠️ <b>오류: 파워팩 비상 정지 버튼 안전 회로 눌림</b><br>✅ 조치: 파워팩 내 비상 정지 버튼의 안전 회로가 차단되었습니다. 차단 원인을 점검하고 상황이 안전해지면 AGV를 리셋하십시오.", en: "⚠️ <b>Error: Emergency stop button safety circuit powerpack pressed</b><br>✅ Action: The safety circuit of the emergency stop button in the power pack is interrupted. Check the reason for pressing the emergency stop or why this circuit is interrupted. Reset the AGV when the situation is safe again." },
  "89": { ko: "⚠️ <b>오류: 구동 인버터 림프 홈 모드 활성화</b><br>✅ 조치: 구동 인버터 중 하나가 오류를 전송하고 비활성화되었습니다. AGV가 감속 상태로 계속 주행합니다. 분석을 위해 진단 도구 및 공급업체의 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Traction inverter limp home active</b><br>✅ Action: One of the traction inverters transmits an error and is disabled. The AGV continues driving at reduced speed. Refer to appropriate diagnostic tools and vendor (troubleshooting) manual for analysis on the error causing one of the traction inverters to shut down." },
  "90": { ko: "⚠️ <b>오류: 직진 구간에서 AGV 경로 이탈 너무 큼</b><br>✅ 조치: AGV가 직진 구간에서 경로를 너무 많이 벗어났습니다. 수동으로 AGV를 제자리에 놓고 작업을 재개하십시오.", en: "⚠️ <b>Error: AGV route deviation on straight segment too large</b><br>✅ Action: The AGV deviated too far from its route on a straight segment. Manually place the AGV back on its route and re-enter operation." },
  "91": { ko: "⚠️ <b>오류: 곡선 구간에서 AGV 경로 이탈 너무 큼</b><br>✅ 조치: AGV가 회전 구간에서 경로를 너무 많이 벗어났습니다. 수동으로 AGV를 제자리에 놓고 작업을 재개하십시오.", en: "⚠️ <b>Error: AGV route deviation in bend too large</b><br>✅ Action: The AGV deviated too far from its route on a turn segment. Manually place the AGV back on its route and re-enter operation." },
  "92": { ko: "⚠️ <b>오류: 크랩(게걸음) 구간에서 AGV 경로 이탈 너무 큼</b><br>✅ 조치: AGV가 크랩 구간에서 경로를 너무 많이 벗어났습니다. 수동으로 AGV를 제자리에 놓고 작업을 재개하십시오.", en: "⚠️ <b>Error: AGV route deviation in crab segment too large</b><br>✅ Action: The AGV deviated too far from its route on a crab segment. Manually place the AGV back on its route and re-enter operation." },
  "93": { ko: "⚠️ <b>오류: 유압 펌프 인버터 오류</b><br>✅ 조치: 유압 펌프 인버터에 오류가 감지되었습니다. 유압유 압력 형성이 불가능할 수 있습니다. 인버터의 결함을 점검하고 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Hydraulic pump inverter error</b><br>✅ Action: An error on the inverter for the hydraulic pump has been detected. There might be no hydraulic oil pressure build up possible. Check the inverter for faults and damage. Refer to the supplier's (troubleshooting) manual and appropriate diagnostic tools for more information on this fault." },
  "94": { ko: "⚠️ <b>오류: 휠 직경 재보정 없이 AGV 너무 멀리 주행함</b><br>✅ 조치: AGV가 휠 직경을 재보정하지 않고 너무 오랫동안 직진했습니다. HMI쪽 버튼을 사용하여 수동 리셋을 수행하십시오.", en: "⚠️ <b>Error: AGV driven too far without wheel diameter recalibration</b><br>✅ Action: The AGV has been driven straight for too long without recalibrating the wheel diameter. Perform a manual reset using the corresponding button on the HMI." },
  "96": { ko: "⚠️ <b>오류: 전면 좌측 타이어 펑크</b><br>✅ 조치: 계산된 타이어 직경이 너무 작아 주행을 계속할 수 없으며 펑크일 가능성이 있습니다. 타이어 공기압을 확인하고 HMI를 사용해 직경을 재설정하십시오.", en: "⚠️ <b>Error: Tire front left flat</b><br>✅ Action: The calculated diameter of the tyre front left is too low for the vehicle to continue driving, possibly the tyre is flat. Check the tyre pressure. After correcting the tyre pressure, reset the wheel diameter using the corresponding button on the HMI." },
  "97": { ko: "⚠️ <b>오류: 전면 우측 타이어 펑크</b><br>✅ 조치: 계산된 타이어 직경이 너무 작아 주행을 계속할 수 없으며 펑크일 가능성이 있습니다. 공기압 확인 후 HMI를 사용해 재설정하십시오.", en: "⚠️ <b>Error: Tire front right flat</b><br>✅ Action: The calculated diameter of the tyre front right is too low for the vehicle to continue driving, possibly the tyre is flat. Check the tyre pressure. After correcting the tyre pressure, reset the wheel diameter using the corresponding button on the HMI." },
  "98": { ko: "⚠️ <b>오류: 후면 좌측 타이어 펑크</b><br>✅ 조치: 계산된 타이어 직경이 너무 작아 주행을 계속할 수 없으며 펑크일 가능성이 있습니다. 공기압 확인 후 HMI를 사용해 재설정하십시오.", en: "⚠️ <b>Error: Tire rear left flat</b><br>✅ Action: The calculated diameter of the tyre rear left is too low for the vehicle to continue driving, possibly the tyre is flat. Check the tyre pressure. After correcting the tyre pressure, reset the wheel diameter using the corresponding button on the HMI." },
  "99": { ko: "⚠️ <b>오류: 후면 우측 타이어 펑크</b><br>✅ 조치: 계산된 타이어 직경이 너무 작아 주행을 계속할 수 없으며 펑크일 가능성이 있습니다. 공기압 확인 후 HMI를 사용해 재설정하십시오.", en: "⚠️ <b>Error: Tire rear right flat</b><br>✅ Action: The calculated diameter of the tyre rear right is too low for the vehicle to continue driving, possibly the tyre is flat. Check the tyre pressure. After correcting the tyre pressure, reset the wheel diameter using the corresponding button on the HMI." },
  "100": { ko: "⚠️ <b>오류: 전면 트랜스폰더 안테나가 트랜스폰더를 놓침</b><br>✅ 조치: AGV가 읽을 것으로 예상했던 트랜스폰더를 전면 안테나가 놓쳤습니다.", en: "⚠️ <b>Error: Transponder antenna front missed transponder</b><br>✅ Action: The front transponder antenna missed one transponder that the AGV did expect to read." },
  "101": { ko: "⚠️ <b>오류: 후면 트랜스폰더 안테나가 트랜스폰더를 놓침</b><br>✅ 조치: AGV가 읽을 것으로 예상했던 트랜스폰더를 후면 안테나가 놓쳤습니다.", en: "⚠️ <b>Error: Transponder antenna rear missed transponder</b><br>✅ Action: The rear transponder antenna missed one transponder that the AGV did expect to read." },
  "102": { ko: "⚠️ <b>오류: 전면 트랜스폰더 안테나가 너무 많은 트랜스폰더를 놓침</b><br>✅ 조치: 전면 안테나가 너무 많은 트랜스폰더를 놓쳐 AGV 주행이 정지되었습니다. 수동으로 경로상에 돌려놓고 작업을 재개하십시오.", en: "⚠️ <b>Error: Transponder antenna front missed too many transponders</b><br>✅ Action: The front transponder antenna missed too many transponders that the AGV did expect to read. The AGV stopped driving. Manually position the AGV back on the route and resume operation." },
  "103": { ko: "⚠️ <b>오류: 후면 트랜스폰더 안테나가 너무 많은 트랜스폰더를 놓침</b><br>✅ 조치: 후면 안테나가 너무 많은 트랜스폰더를 놓쳐 AGV 주행이 정지되었습니다. 수동으로 경로상에 돌려놓고 작업을 재개하십시오.", en: "⚠️ <b>Error: Transponder antenna rear missed too many transponders</b><br>✅ Action: The rear transponder antenna missed too many transponders that the AGV did expect to read. The AGV stopped driving. Manually position the AGV back on the route and resume operation." },
  "104": { ko: "⚠️ <b>오류: 전면 트랜스폰더 안테나가 여러 트랜스폰더를 놓침</b><br>✅ 조치: 전면 안테나가 AGV가 읽을 것으로 예상했던 다수의 트랜스폰더를 놓쳤습니다.", en: "⚠️ <b>Error: Transponder antenna front missed multiple transponders</b><br>✅ Action: The front transponder antenna missed multiple transponders that the AGV did expect to read." },
  "105": { ko: "⚠️ <b>오류: 후면 트랜스폰더 안테나가 여러 트랜스폰더를 놓침</b><br>✅ 조치: 후면 안테나가 AGV가 읽을 것으로 예상했던 다수의 트랜스폰더를 놓쳤습니다.", en: "⚠️ <b>Error: Transponder antenna rear missed multiple transponders</b><br>✅ Action: The rear transponder antenna missed multiple transponders that the AGV did expect to read." },
  "106": { ko: "⚠️ <b>오류: 전면 트랜스폰더 안테나 통신 오류</b><br>✅ 조치: 내비게이션이 전면 안테나와의 CAN 통신 오류를 감지했습니다. 통신 복구 시까지 감속 주행합니다. CAN 버스와 배선을 점검하십시오.", en: "⚠️ <b>Error: Transponder antenna front communication error</b><br>✅ Action: The navigation detects CAN communication error with the front transponder antenna. The AGV continues driving at reduced speed until communication is restored. Check the CAN bus (quality), wiring and functioning of the module." },
  "107": { ko: "⚠️ <b>오류: 후면 트랜스폰더 안테나 통신 오류</b><br>✅ 조치: 내비게이션이 후면 안테나와의 CAN 통신 오류를 감지했습니다. 통신 복구 시까지 감속 주행합니다. CAN 버스와 배선을 점검하십시오.", en: "⚠️ <b>Error: Transponder antenna rear communication error</b><br>✅ Action: The navigation detects a CAN communication error with the rear transponder antenna. The AGV continues driving at reduced speed until communication is restored. Check the CAN bus (quality), wiring and functioning of the module." },
  "108": { ko: "⚠️ <b>오류: VCU 통신 카운터 오류</b><br>✅ 조치: 리셋하시고 안되면 재부팅 하이소. 자주뜨면 APC연결 케이블 보시고 라우터도 봐야됨.", en: "⚠️ <b>Error: Communication VCU counter error</b><br>✅ Action: The CAN lifecounter of the VCU is not functioning as expected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "109": { ko: "⚠️ <b>오류: 전면 트랜스폰더 안테나가 잘못된 트랜스폰더 2개를 연속으로 읽음</b><br>✅ 조치: 전면 안테나가 계산된 AGV 위치와 일치하지 않는 2개의 트랜스폰더를 연속으로 읽었습니다. 단말기 상의 위치를 확인하고 트랜스폰더 프로그래밍을 점검하십시오.", en: "⚠️ <b>Error: Transponder antenna front two wrong transponders read</b><br>✅ Action: The front transponder antenna has read 2 transponders in succession that do not match the calculated position of the AGV. Check the position of AGV on terminal with the position where the AGV thinks it is. If this is correct, check the programming of respective transponders." },
  "110": { ko: "⚠️ <b>오류: 후면 트랜스폰더 안테나가 잘못된 트랜스폰더 2개를 연속으로 읽음</b><br>✅ 조치: 후면 안테나가 계산된 위치와 일치하지 않는 2개의 트랜스폰더를 연속으로 읽었습니다. 위치 확인 후 트랜스폰더 프로그래밍을 점검하십시오.", en: "⚠️ <b>Error: Transponder antenna rear two wrong transponders read</b><br>✅ Action: The rear transponder antenna has read 2 transponders in succession that do not match the calculated position of the AGV. Check the position of AGV on terminal with the position where the AGV thinks it is. If this is correct, check the programming of respective transponders." },
  "111": { ko: "⚠️ <b>오류: VCU 통신 CRC 오류</b><br>✅ 조치: 내비게이션 체크섬이 VCU에서 보낸 데이터와 일치하지 않습니다. AGV를 리셋하고 지속되면 재시작하십시오.", en: "⚠️ <b>Error: Communication VCU CRC error</b><br>✅ Action: The checksum of the navigation does not match the data in the message sent by the VCU. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the modules." },
  "112": { ko: "⚠️ <b>오류: BMS 통신 CRC 오류</b><br>✅ 조치: VCU 체크섬이 BMS에서 보낸 데이터와 일치하지 않습니다. AGV를 리셋하고 지속되면 재시작하십시오.", en: "⚠️ <b>Error: Communication BMS CRC error</b><br>✅ Action: The checksum of the VCU does not match the data in the message sent by the BMS. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the modules." },
  "113": { ko: "⚠️ <b>오류: 내비게이션 통신 CRC 오류</b><br>✅ 조치: VCU 체크섬이 내비게이션에서 보낸 데이터와 일치하지 않습니다. AGV를 리셋하고 지속되면 재시작하십시오.", en: "⚠️ <b>Error: Communication navigation CRC error</b><br>✅ Action: The checksum of the VCU does not match the data in the message sent by the navigation. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the modules." },
  "114": { ko: "⚠️ <b>오류: AGV 정지 상태, 전기 캐비닛 도어 열림</b><br>✅ 조치: AGV의 도어 중 하나가 열려 있어 새로운 경로 시작을 방지하고 있습니다. 도어를 모두 닫고 센서 조정을 확인하십시오.", en: "⚠️ <b>Error: AGV standing still door e-cabinet open</b><br>✅ Action: One of the doors of the AGV is open, preventing the AGV from starting a new route. Close all doors and check the adjustment of the door sensors if necessary." },
  "115": { ko: "⚠️ <b>오류: 속도 인코더 회전 방향 오류</b><br>✅ 조치: 속도 인코더 중 하나가 잘못된 방향으로 회전하고 있습니다. 진단 도구를 사용하여 기능을 확인하고 배선을 점검하십시오.", en: "⚠️ <b>Error: Speed encoder direction of rotation error</b><br>✅ Action: One of the speed encoders is rotating in the wrong direction. Check the functionality of the encoders using suitable diagnostic tools and check cabling." },
  "116": { ko: "⚠️ <b>오류: AGV 슬립 오류 또는 예상보다 적은 거리 이동</b><br>✅ 조치: AGV가 예상보다 덜 이동했습니다. AGV의 위치와 노면에서의 타이어 미끄러짐을 확인하십시오.", en: "⚠️ <b>Error: AGV slip error or less distance travelled than expected</b><br>✅ Action: The AGV has traveled less distance than expected. Check the position of the AGV and tyre slippage on the surface." },
  "117": { ko: "⚠️ <b>오류: BMS 상태 오류</b><br>✅ 조치: 배터리 관리 시스템(BMS)이 오류 상태에 있습니다. 공급업체의 매뉴얼과 진단 도구를 참조하십시오.", en: "⚠️ <b>Error: BMS state in error</b><br>✅ Action: The Battery Management System (BMS) is in error status. Refer to the supplier's troubleshooting manual and appropriate diagnostic tools for more information on this fault." },
  "121": { ko: "⚠️ <b>오류: AGV 호스트 이름을 확인할 수 없음</b><br>✅ 조치: 내비게이션 소프트웨어가 AGV 호스트 이름을 확인할 수 없습니다. 구성을 포함한 USB 스틱을 확인하십시오. 현재 FMS 시스템에 연결할 수 없습니다.", en: "⚠️ <b>Error: AGV hostname could not be resolved</b><br>✅ Action: The navigation software is unable to determine the AGV hostname. Check the USB stick with the hostname configuration. The AGV is unable to connect to the FMS system now." },
  "122": { ko: "⚠️ <b>오류: AGV 빠르게 정차 실패, E스탑 활성화됨</b><br>✅ 조치: 빠르게 정차하는 중 필요만큼 속도를 줄이지 못해 E 스탑이 트리거됩니다. 이 알람이 자주 발생하면 유압 시스템 및 밸브의 배선과 기능을 점검하십시오.", en: "⚠️ <b>Error: AGV fast stop failed emergency stop activated</b><br>✅ Action: The AGV is unable to reduce speed as fast as needed during the fast stop. An emergency stop will be triggered. If this alarm occurs frequently, check the wiring and functioning of the hydraulic system and its valves." },
  "123": { ko: "⚠️ <b>오류: AGV 정상 정지 불가, 작동 속도 제한됨</b><br>✅ 조치: 이 속도로 요구 거리 내에 정상 정지할 수 없습니다. 배터리가 꽉 찼거나 스트링을 사용할 수 없기 때문일 수 있습니다. 이 조건이 발동된 동안 작동 속도가 제한됩니다.", en: "⚠️ <b>Error: AGV normal stop not feasibly operating speed limited</b><br>✅ Action: The AGV will not be able perform a normal stop within the required distance at this speed. This can be due to the battery being full or strings being unavailable. The AGV operating speed will be limited for as long as this condition is true." },
  "124": { ko: "⚠️ <b>오류: AGV 빠르게 정차 불가, 작동 속도 제한됨</b><br>✅ 조치: 이 속도로 요구 거리 내에 급속 정지할 수 없습니다. 배터리가 꽉 찼거나 스트링 사용이 불가하기 때문일 수 있습니다. 이 조건이 지속되는 한 작동 속도가 제한됩니다.", en: "⚠️ <b>Error: AGV fast stop not feasible operating speed limited</b><br>✅ Action: The AGV will not be able perform a fast stop within the required distance at this speed. This can be due to the battery being full or strings being unavailable. The AGV operating speed will be limited for as long as this condition is true." },
  "125": { ko: "⚠️ <b>오류: 전면 장애물 감지로 인한 비상 정지</b><br>✅ 조치: 전면 장애물 감지 기능이 비상 정지 영역에서 물체를 감지하여 충돌을 피하기 위해 완전히 멈췄습니다. 앞쪽에 물체가 있는지 확인하고 가능하면 물체를 제거하거나 AGV를 이동시켜 작업을 재개하십시오.", en: "⚠️ <b>Error: Obstacle detection front emergency stop</b><br>✅ Action: The obstacle detection at the front of the AGV detects an object in the emergency stop field. The AGV makes a full stop to avoid a collision with the object. Check at the front of the AGV for an object. Remove the object if possible or move the AGV and resume operation." },
  "126": { ko: "⚠️ <b>오류: 후면 장애물 감지로 인한 비상 정지</b><br>✅ 조치: 후면 장애물 감지 기능이 비상 정지 영역에서 물체를 감지하여 완전히 멈췄습니다. 뒤쪽의 물체를 확인하고 가능하면 제거한 후 작업을 재개하십시오.", en: "⚠️ <b>Error: Obstacle detection rear emergency stop</b><br>✅ Action: The obstacle detection at the rear of the AGV detects an object in the emergency stop field. The AGV makes a full stop to avoid a collision with the object. Check at the rear of the AGV for an object. Remove the object if possible or move the AGV and resume operation." },
  "127": { ko: "⚠️ <b>오류: 전면 장애물 감지로 인한 정상 정지</b><br>✅ 조치: 전면 장애물 감지 기능이 경고 영역에서 물체를 감지하여 AGV가 브레이크를 밟습니다.", en: "⚠️ <b>Error: Obstacle detection front normal stop</b><br>✅ Action: The obstacle detection at the front of the AGV an object detected in the warning field. The AGV brakes." },
  "128": { ko: "⚠️ <b>오류: 후면 장애물 감지로 인한 정상 정지</b><br>✅ 조치: 후면 장애물 감지 기능이 경고 영역에서 물체를 감지하여 AGV가 브레이크를 밟습니다.", en: "⚠️ <b>Error: Obstacle detection rear normal stop</b><br>✅ Action: The obstacle detection at the rear of the AGV an object detected in the warning field. The AGV brakes." },
  "129": { ko: "⚠️ <b>오류: VCU 라이선스 키가 유효하지 않음</b><br>✅ 조치: VCU에 입력된 라이선스 키가 유효하지 않아 AGV를 사용할 수 없습니다. 유효한 라이선스 키를 업로드 후 재시작하거나 지원팀에 문의하십시오.", en: "⚠️ <b>Error: VCU license key invalid</b><br>✅ Action: The license key entered in the VCU is invalid. The AGV can not be used. Upload a valid license key into the VCU and restart the AGV or contact VDL for support on this." },
  "130": { ko: "⚠️ <b>오류: VCU 펌웨어 버전이 지원되지 않음</b><br>✅ 조치: VCU의 펌웨어 버전이 업로드된 소프트웨어에서 지원되지 않습니다. VDL에서 제공한 버전과 일치하는지 확인하고 올바른 버전으로 업데이트하십시오.", en: "⚠️ <b>Error: VCU firmware version not supported</b><br>✅ Action: The firmware version of the VCU is not supported by the software uploaded in the VCU. Check if the firmware version of the VCU matches the given firmware version by VDL. If not, update the firmware of the VCU to the correct version." },
  "131": { ko: "⚠️ <b>오류: HMI 라이선스 키가 유효하지 않음</b><br>✅ 조치: HMI에 입력된 라이선스 키가 유효하지 않아 AGV를 사용할 수 없습니다. 유효한 라이선스 키를 업로드 후 재시작하거나 지원팀에 문의하십시오.", en: "⚠️ <b>Error: HMI license key invalid</b><br>✅ Action: The license key entered in the HMI is invalid. The AGV can not be used. Upload a valid license key into the HMI and restart the AGV or contact VDL for support on this issue." },
  "132": { ko: "⚠️ <b>오류: HMI 소프트웨어 버전이 지원되지 않음</b><br>✅ 조치: HMI 소프트웨어 버전이 VCU 및 내비게이션 소프트웨어에서 지원되지 않습니다. 지원되는 버전으로 업데이트하십시오.", en: "⚠️ <b>Error: HMI software version not supported</b><br>✅ Action: The HMI software version is not supported by the VCU and Navigation software. Update the software to a supported version." },
  "133": { ko: "⚠️ <b>오류: VCU 소프트웨어 버전이 지원되지 않음</b><br>✅ 조치: VCU 소프트웨어 버전이 HMI 및 내비게이션 소프트웨어에서 지원되지 않습니다. 지원되는 버전으로 업데이트하십시오.", en: "⚠️ <b>Error: VCU software version not supported</b><br>✅ Action: The VCU software version is not supported by the HMI and Navigation software. Update the software to a supported version." },
  "134": { ko: "⚠️ <b>오류: 내비게이션 소프트웨어 버전이 지원되지 않음</b><br>✅ 조치: 내비게이션 소프트웨어 버전이 VCU 및 HMI 소프트웨어에서 지원되지 않습니다. 지원되는 버전으로 업데이트하십시오.", en: "⚠️ <b>Error: Navigation software version not supported</b><br>✅ Action: The Navigation software version is not supported by the VCU and HMI software. Update the software to a supported version." },
  "135": { ko: "⚠️ <b>오류: AGV 정지 상태, 구동 냉각 펌프 인버터 오류</b><br>✅ 조치: 구동 시스템 냉각액 펌프용 인버터 오류가 감지되어 새로운 경로 시작을 방지합니다. 구동 시스템의 냉각수 순환이 없습니다. 인버터 결함 및 손상 여부를 확인하십시오.", en: "⚠️ <b>Error: AGV standing still traction cooling pump inverter error</b><br>✅ Action: An error on the inverter for the cooling fluid pump for the traction system has been detected, preventing the AGV from starting a new route. There is no cooling fluid circulation in the traction system anymore. Check the inverter for faults and damage. Refer to the supplier's (troubleshooting) manual and appropriate diagnostic tools for more information on this fault." },
  "136": { ko: "⚠️ <b>오류: PCS 비상 정지</b><br>✅ 조치: FMS/PCS 시스템이 AGV에 비상 정지 명령을 보냈습니다.", en: "⚠️ <b>Error: PCS emergency stop</b><br>✅ Action: The FMS/PCS system sent an emergency stop command to the AGV." },
             "138": { ko: "⚠️ <b>오류: HMI 펌웨어 버전 미지원</b><br>✅ 조치: HMI 펌웨어 버전이 업로드된 소프트웨어에서 지원되지 않습니다. VDL에서 제공한 버전과 일치하는지 확인하고, 다르면 올바른 버전으로 업데이트하십시오.", en: "⚠️ <b>Error: HMI firmware version not supported</b><br>✅ Action: The firmware version of the HMI is not supported by the software uploaded in the HMI. Check if the firmware version of the HMI matches the given firmware version by VDL. If not, update the firmware of the HMI to the correct version." },
  "139": { ko: "⚠️ <b>오류: 전면 조향 정렬 오류 또는 보정 오류</b><br>✅ 조치: AGV 전면 조향각의 계산된 오프셋이 너무 큽니다. 조향 정렬을 확인하고 필요한 경우 기계적으로 또는 HMI를 통해 수정하십시오.", en: "⚠️ <b>Error: Steering alignment front error or calibration error</b><br>✅ Action: The calculated offset in the steering angle at the front of the AGV is too large. Check the steering alignment and correct it mechanically and/or via the HMI if necessary." },
  "140": { ko: "⚠️ <b>오류: 후면 조향 정렬 오류 또는 보정 오류</b><br>✅ 조치: AGV 후면 조향각의 계산된 오프셋이 너무 큽니다. 조향 정렬을 확인하고 필요한 경우 기계적으로 또는 HMI를 통해 수정하십시오.", en: "⚠️ <b>Error: Steering alignment rear error or calibration error</b><br>✅ Action: The calculated offset in the steering angle at the rear of the AGV is too large. Check the steering alignment and correct it mechanically and/or via the HMI if necessary." },
  "141": { ko: "⚠️ <b>오류: PCS 경로 오류</b><br>✅ 조치: PCS에서 수신한 경로가 AGV에 의해 유효하지 않은 것으로 표시되었습니다. AGV를 초기화하고 새 경로를 전송하십시오.", en: "⚠️ <b>Error: PCS route error</b><br>✅ Action: The received route from PCS has been marked as invalid by the AGV. Send a reset to the AGV and a new route." },
  "142": { ko: "⚠️ <b>오류: PCS 정지 지점 오류</b><br>✅ 조치: PCS에서 수신한 정지 지점이 AGV에 의해 유효하지 않은 것으로 표시되었습니다. AGV를 초기화하고 새 경로를 전송하십시오.", en: "⚠️ <b>Error: PCS stopping point error</b><br>✅ Action: The received stop point from PCS has been marked as invalid by the AGV. Send a reset to the AGV and a new route." },
  "143": { ko: "⚠️ <b>오류: 경로 상의 AGV 트랜스폰더 위치 무효</b><br>✅ 조치: 읽힌 트랜스폰더를 기반으로 한 AGV 위치가 주어진 경로에서 유효하지 않습니다. 수동으로 AGV를 경로에 다시 배치하고 작업을 재개하십시오.", en: "⚠️ <b>Error: AGV transponder position on route invalid</b><br>✅ Action: The position of the AGV based on the read transponder is not valid on the given route. Manually place the AGV back on the route and re-enter operation." },
  "144": { ko: "⚠️ <b>오류: 전면 좌측 휠 직경 과다 또는 속도 인코더 오류</b><br>✅ 조치: 전면 좌측 타이어의 계산된 휠 직경이 너무 큽니다. 속도 인코더의 기능을 확인하고 필요시 타이어 압력을 수정하십시오. 이후 HMI를 통해 휠 직경을 재설정하십시오.", en: "⚠️ <b>Error: Wheel diameter front left too large or speed encoder error</b><br>✅ Action: The calculated wheel diameter of the front left tyre is too large. Check the functionality of the speed encoder and correct the tyre pressure if necessary. After this, reset the wheel diameter via the HMI." },
  "145": { ko: "⚠️ <b>오류: 전면 우측 휠 직경 과다 또는 속도 인코더 오류</b><br>✅ 조치: 전면 우측 타이어의 계산된 휠 직경이 너무 큽니다. 속도 인코더의 기능을 확인하고 필요시 타이어 압력을 수정하십시오. 이후 HMI를 통해 휠 직경을 재설정하십시오.", en: "⚠️ <b>Error: Wheel diameter front right too large or speed encoder error</b><br>✅ Action: The calculated wheel diameter of the front right tyre is too large. Check the functionality of the speed encoder and correct the tyre pressure if necessary. After this, reset the wheel diameter via the HMI." },
  "146": { ko: "⚠️ <b>오류: 후면 좌측 휠 직경 과다 또는 속도 인코더 오류</b><br>✅ 조치: 후면 좌측 타이어의 계산된 휠 직경이 너무 큽니다. 속도 인코더의 기능을 확인하고 필요시 타이어 압력을 수정하십시오. 이후 HMI를 통해 휠 직경을 재설정하십시오.", en: "⚠️ <b>Error: Wheel diameter rear left too large or speed encoder error</b><br>✅ Action: The calculated wheel diameter of the rear left tyre is too large. Check the functionality of the speed encoder and correct the tyre pressure if necessary. After this, reset the wheel diameter via the HMI." },
  "147": { ko: "⚠️ <b>오류: 후면 우측 휠 직경 과다 또는 속도 인코더 오류</b><br>✅ 조치: 후면 우측 타이어의 계산된 휠 직경이 너무 큽니다. 속도 인코더의 기능을 확인하고 필요시 타이어 압력을 수정하십시오. 이후 HMI를 통해 휠 직경을 재설정하십시오.", en: "⚠️ <b>Error: Wheel diameter rear right too large or speed encoder error</b><br>✅ Action: The calculated wheel diameter of the rear right tyre is too large. Check the functionality of the speed encoder and correct the tyre pressure if necessary. After this, reset the wheel diameter via the HMI." },
  "148": { ko: "⚠️ <b>오류: AGV 이동 안 함</b><br>✅ 조치: AGV를 리셋하거나 MCD를 이용해 이동시킨 후 리셋하시오.", en: "⚠️ <b>Error: AGV does not move</b><br>✅ Action: The AGV is moving in the wrong direction or moving too slowly. Check the path of the AGV for obstacles and check the AGV for other malfunctions of the traction or hydraulic system." },
  "149": { ko: "⚠️ <b>오류: 전면 조향 제어 오류</b><br>✅ 조치: 전면 축의 AGV 조향각이 너무 크거나 두 조향각 인코더에 오류가 있습니다. 조향각과 축의 손상 여부를 확인하십시오. CAN 버스, 배선 및 모듈의 기능을 점검하십시오.", en: "⚠️ <b>Error: Steering control front error</b><br>✅ Action: The steering angle of the AGV on the front axle is too large or both steering angle encoders have an error. Check the steering angle, and the axle for damage. Check the CAN bus (quality), wiring and functioning of the modules." },
  "150": { ko: "⚠️ <b>오류: 후면 조향 제어 오류</b><br>✅ 조치: 후면 축의 AGV 조향각이 너무 크거나 두 조향각 인코더에 오류가 있습니다. 조향각과 축의 손상 여부를 확인하십시오. CAN 버스, 배선 및 모듈의 기능을 점검하십시오.", en: "⚠️ <b>Error: Steering control rear error</b><br>✅ Action: The steering angle of the AGV on the rear axle is too large or both steering angle encoders have an error. Check the steering angle, and the axle for damage. Check the CAN bus (quality), wiring and functioning of the modules." },
  "151": { ko: "⚠️ <b>오류: 전면 조향 제어 경고</b><br>✅ 조치: 원하는 내비게이션 조향각과 실제 전면 축 조향각 사이에 원치 않는 편차가 있습니다. 시스템 유압 펌프, 인버터 기능, 누출, 어큐뮬레이터 질소 압력, 결함 센서 및 밸브를 확인하십시오.", en: "⚠️ <b>Error: Steering control front warning</b><br>✅ Action: There is an unwanted deviation between the desired steering angle of navigation and the actual steering angle of the front axle, indicative. Check system hydraulics for functionality pump and inverter, leaks, accumulator nitrogen pressure, faulty sensors and valves." },
  "152": { ko: "⚠️ <b>오류: 후면 조향 제어 경고</b><br>✅ 조치: 원하는 내비게이션 조향각과 실제 후면 축 조향각 사이에 원치 않는 편차가 있습니다. 시스템 유압 펌프, 인버터 기능, 누출, 어큐뮬레이터 질소 압력, 결함 센서 및 밸브를 확인하십시오.", en: "⚠️ <b>Error: Steering control rear warning</b><br>✅ Action: There is an unwanted deviation between the desired steering angle of navigation and the actual steering angle of the rear axle, indicative. Check system hydraulics for functionality pump and inverter, leaks, accumulator nitrogen pressure, faulty sensors and valves." },
  "154": { ko: "⚠️ <b>오류: AGV 초기 위치 불가능</b><br>✅ 조치: 첫 번째 경로 지점과 비교한 위치 문제로 AGV가 FMS의 경로를 거부했습니다. 다른 시작 지점을 가진 새 경로를 보내거나 AGV의 위치를 재조정하십시오.", en: "⚠️ <b>Error: AGV initial position infeasible</b><br>✅ Action: The AGV received a route from FMS which is denied by the AGV because of the AGV position compared to the first route point. The AGV will not drive. Send a new route with a different first route point or re-position the AGV." },
  "155": { ko: "⚠️ <b>오류: AGV 위치 점프 과다</b><br>✅ 조치: 주행 거리 계산에서 AGV의 위치 보정 값이 너무 큽니다. 수동으로 AGV를 경로에 다시 배치하고 작업을 재개하십시오.", en: "⚠️ <b>Error: AGV position jump too high</b><br>✅ Action: The position correction of the AGV on the odometry calculation is too large. Manually place the AGV back on the route and retake in operation." },
  "162": { ko: "⚠️ <b>오류: 지정된 구역 외부의 AGV 위치 보고</b><br>✅ 조치: AGV가 지정된 작동 영역을 벗어났습니다. 수동으로 작동 구역 안으로 옮기고 작업을 재개하십시오.", en: "⚠️ <b>Error: AGV position report outside defined zone</b><br>✅ Action: The AGV is outside defined operational area: Manually place the AGV back in operational area and re-enter operation." },
  "164": { ko: "⚠️ <b>오류: 브레이크 해제 불가</b><br>✅ 조치: 브레이크를 풀 수 없습니다. 유압 시스템 펌프 및 인버터 기능, 누출, 어큐뮬레이터 질소 압력, 밸브 등을 확인하고 브레이크 손상/마모를 점검하십시오.", en: "⚠️ <b>Error: Brakes are not released</b><br>✅ Action: The brakes cannot be released. Check the hydraulic system for functionality of the pump and inverter, leaks, accumulator nitrogen pressure, faulty sensors and valves. Check the brakes for damage/wear." },
  "165": { ko: "⚠️ <b>오류: 전면 장애물 감지 통신 오류</b><br>✅ 조치: 전면 장애물 감지와 이더넷 통신 오류가 발생했습니다. 통신 복구 시까지 감속 주행합니다. AGV를 초기화하거나 재시작하고 케이블 및 모듈을 점검하십시오.", en: "⚠️ <b>Error: Obstacle detection front communication error</b><br>✅ Action: There is an ethernet communication error with the front obstacle detection. The AGV continues driving at reduced speed until communication is restored. Reset the AGV. If this error remains present, restart the AGV. Check the ethernet cabling and functioning of the module." },
  "166": { ko: "⚠️ <b>오류: 후면 장애물 감지 통신 오류</b><br>✅ 조치: 후면 장애물 감지와 이더넷 통신 오류가 발생했습니다. 통신 복구 시까지 감속 주행합니다. AGV를 초기화하거나 재시작하고 케이블 및 모듈을 점검하십시오.", en: "⚠️ <b>Error: Obstacle detection rear communication error</b><br>✅ Action: There is an ethernet communication error with the rear obstacle detection. The AGV continues driving at reduced speed until communication is restored. Reset the AGV. If this error remains present, restart the AGV. Check the ethernet cabling and functioning of the module." },
  "168": { ko: "⚠️ <b>오류: 전면 장애물 감지 오염 오류</b><br>✅ 조치: 전면 센서가 심하게 오염되었습니다. 적절한 세척제로 닦아내십시오. 오염으로 인해 장애물 감지가 제대로 작동하지 않을 수 있습니다.", en: "⚠️ <b>Error: Obstacle detection front contamination error</b><br>✅ Action: The obstacle detection front reports that the sensor is heavily contaminated. Clean the sensor with suitable cleaning agents. The obstacle detection might not work properly anymore because of this contamination." },
  "169": { ko: "⚠️ <b>오류: 후면 장애물 감지 오염 오류</b><br>✅ 조치: 후면 센서가 심하게 오염되었습니다. 적절한 세척제로 닦아내십시오. 오염으로 인해 장애물 감지가 제대로 작동하지 않을 수 있습니다.", en: "⚠️ <b>Error: Obstacle detection rear contamination error</b><br>✅ Action: The obstacle detection rear reports that the sensor is heavily contaminated. Clean the sensor with suitable cleaning agents. The obstacle detection might not work properly anymore because of this contamination." },
  "170": { ko: "⚠️ <b>오류: 전면 장애물 감지 오염 경고</b><br>✅ 조치: 전면 센서가 오염되었습니다. 적절한 세척제로 닦아내십시오. 오염으로 인해 장애물 감지가 제대로 작동하지 않을 수 있습니다.", en: "⚠️ <b>Error: Obstacle detection front contamination warning</b><br>✅ Action: The obstacle detection front reports that the sensor is contaminated. Clean the sensor with suitable cleaning agents. The obstacle detection might not work properly anymore because of this contamination." },
  "171": { ko: "⚠️ <b>오류: 후면 장애물 감지 오염 경고</b><br>✅ 조치: 후면 센서가 오염되었습니다. 적절한 세척제로 닦아내십시오. 오염으로 인해 장애물 감지가 제대로 작동하지 않을 수 있습니다.", en: "⚠️ <b>Error: Obstacle detection rear contamination warning</b><br>✅ Action: The obstacle detection rear reports that the sensor is contaminated. Clean the sensor with suitable cleaning agents. The obstacle detection might not work properly anymore because of this contamination." },
  "172": { ko: "⚠️ <b>오류: 전면 장애물 감지 이상</b><br>✅ 조치: 전면 장애물 감지 장치 오류가 발생했습니다. 적절한 진단 도구 및 공급업체의 문제 해결 설명서를 참조하여 분석하십시오.", en: "⚠️ <b>Error: Obstacle detection front not ok</b><br>✅ Action: The obstacle detection front reports a status with a device error. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for analysis on the fault and more information on it." },
  "173": { ko: "⚠️ <b>오류: 후면 장애물 감지 이상</b><br>✅ 조치: 후면 장애물 감지 장치 오류가 발생했습니다. 적절한 진단 도구 및 공급업체의 문제 해결 설명서를 참조하여 분석하십시오.", en: "⚠️ <b>Error: Obstacle detection rear not ok</b><br>✅ Action: The obstacle detection rear reports a status with a device error. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for analysis on the fault and more information on it." },
  "174": { ko: "⚠️ <b>오류: 자동 모드 중 전면 장애물 감지 유지보수 테스트 활성화됨</b><br>✅ 조치: AGV가 자동 모드인데 HMI에서 전면 장애물 감지 테스트가 활성화되었습니다. 충전/연료 주입 모드에서 자체 테스트를 비활성화하고 작업을 재개하십시오.", en: "⚠️ <b>Error: Obstacle detection front maintenance test active in auto</b><br>✅ Action: The obstacle detection front test on the HMI is active, but the AGV is in automatic mode. De-activate the self-test in refuelling/charge mode and take the AGV back into operation." },
  "175": { ko: "⚠️ <b>오류: 자동 모드 중 후면 장애물 감지 유지보수 테스트 활성화됨</b><br>✅ 조치: AGV가 자동 모드인데 HMI에서 후면 장애물 감지 테스트가 활성화되었습니다. 충전/연료 주입 모드에서 자체 테스트를 비활성화하고 작업을 재개하십시오.", en: "⚠️ <b>Error: Obstacle detection rear maintenance test active in auto</b><br>✅ Action: The obstacle detection rear test on the HMI is active, but the AGV is in automatic mode. De-activate the self-test in refuelling/charge mode and take the AGV back into operation." },
  "178": { ko: "⚠️ <b>오류: 브레이크 적용 실패</b><br>✅ 조치: 브레이크를 작동할 수 없습니다. 유압 시스템 펌프 및 인버터 기능, 누출, 어큐뮬레이터 질소 압력 등을 확인하고 브레이크 손상/마모를 점검하십시오.", en: "⚠️ <b>Error: Brakes applying failed</b><br>✅ Action: The brakes cannot be applied. Check the hydraulic system for functionality of the pump and inverter, leaks, accumulator nitrogen pressure, faulty sensors and valves. Check the brakes for damage/wear." },
  "179": { ko: "⚠️ <b>오류: 내비게이션 파라미터 파일 체크섬 오류</b><br>✅ 조치: 계산된 AGV 내비게이션 파라미터 체크섬이 올바르지 않습니다. AGV를 초기화하고 필요시 HMI에서 휠 직경을 재설정하십시오. 계속 오류가 나면 새 빈 파라미터 파일을 업로드하십시오.", en: "⚠️ <b>Error: Navigation parameter file checksum error</b><br>✅ Action: The calculated checksum of the navigation's AGV parameters is incorrect. Reset the AGV and, if necessary, the wheel diameter on the HMI. Upload a new empty parameter file if this error remains active." },
  "180": { ko: "⚠️ <b>오류: 주행 중 브레이크 작동됨</b><br>✅ 조치: 브레이크 압력이 너무 낮아 주행 중 브레이크가 (부분적으로) 걸립니다. 유압 시스템을 점검하고 필요시 브레이크 손상 여부를 확인하십시오.", en: "⚠️ <b>Error: Brakes applied while driving</b><br>✅ Action: Brake pressure is too low causing the brakes to be (partially) set while driving. Check the hydraulic system for functionality pump and inverter, leaks, accumulator nitrogen pressure, faulty sensors and valves. If necessary, check the brakes for damage/wear." },
  "181": { ko: "⚠️ <b>오류: 내비게이션 컨트롤러 하드디스크 꽉 참</b><br>✅ 조치: 내비게이션 컨트롤러의 저장 메모리가 꽉 찼습니다. 오래된 로그 파일을 삭제하여 공간을 확보하십시오. 실패 시 이미지를 덮어쓰십시오.", en: "⚠️ <b>Error: Navigation controller harddisk full</b><br>✅ Action: The navigation controller's storage memory is full. Delete old log files to free up space. If this fails, overwrite the image." },
  "182": { ko: "⚠️ <b>오류: 모드 선택 스위치가 자동 모드가 아님</b><br>✅ 조치: 할당된 상태에서 선택 스위치를 통해 AGV가 '자동' 이외의 모드로 전환되었습니다. 스위치 위치와 AGV 작동 상태를 확인하십시오.", en: "⚠️ <b>Error: Mode selector switch not in mode automatic</b><br>✅ Action: The AGV moved to a mode other than \"Automatic\" via the selector switch while it was allocated. Check the position of the selector switch and the operational status of the AGV." },
  "183": { ko: "⚠️ <b>오류: 모드 선택 스위치가 충전 모드임</b><br>✅ 조치: 할당된 상태에서 선택 스위치를 통해 AGV가 '충전' 모드로 전환되었습니다. 스위치 위치와 AGV 작동 상태를 확인하십시오.", en: "⚠️ <b>Error: Mode selector switch in mode charge</b><br>✅ Action: AGV was switched to \"Charge\" mode via the selector switch while it was allocated. Check the position of the selector switch and the operational status of the AGV." },
  "187": { ko: "⚠️ <b>오류: AGV 위치 정렬(포지셔닝) 진입 속도가 너무 빠릅니다.</b><br>✅ 조치: 위치 지정 속도가 너무 빨라 비상 시 정지 지점에 제때 멈출 수 없습니다. 위치, 서스펜션 손상 및 무게 센서를 확인하고, 부정확 시 재설정하십시오.", en: "⚠️ <b>Error: AGV positioning speed too high</b><br>✅ Action: The AGV started positioning at too high a speed which prevents it from stopping in time for the stop point in case of an emergency. Check the position of the AGV, ride suspension for damage and the adjustment of the weight sensors if the weight sensors indicate an incorrect value, correct it before resetting the AGV." },
  "189": { ko: "⚠️ <b>오류: 잘못된 PCS 메시지 코드 수신</b><br>✅ 조치: PCS에서 전송한 메시지 코드가 잘못되었습니다. PCS에서 전송한 메시지를 확인하십시오.", en: "⚠️ <b>Error: PCS wrong message code received</b><br>✅ Action: The message code sent by PCS incorrect. Please check the message sent by PCS." },
  "190": { ko: "⚠️ <b>오류: PCS 메시지가 너무 긺</b><br>✅ 조치: PCS에서 전송한 메시지가 너무 깁니다. PCS에서 전송한 메시지를 확인하십시오.", en: "⚠️ <b>Error: PCS message too long</b><br>✅ Action: The message sent by PCS is too long. Please check the message sent by PCS." },
  "191": { ko: "⚠️ <b>오류: PCS 메시지가 너무 짧음</b><br>✅ 조치: PCS에서 전송한 메시지가 너무 짧습니다. PCS에서 전송한 메시지를 확인하십시오.", en: "⚠️ <b>Error: PCS message too short</b><br>✅ Action: The message sent by PCS is too short. Please check the message sent by PCS." },
  "192": { ko: "⚠️ <b>오류: AGV 중량물 적재</b><br>✅ 조치: AGV의 적재 하중이 62,000kg을 초과했습니다. 하중을 줄일 때까지 AGV가 감속 주행합니다.", en: "⚠️ <b>Error: AGV carrying heavy load</b><br>✅ Action: The measured load present on the AGV is more than 62,000 kg. The AGV drives slower as a result until the load removed or is less than 62,000 kg." },
  "194": { ko: "⚠️ <b>오류: FMS 통신 FSS 포트 오류</b><br>✅ 조치: AGV와 FMS 간 FSS 포트 통신이 없습니다. AGV가 연결을 계속 시도하며, 30초 후에도 유지되면 FMS에서 FSS 포트 TCP 연결을 재설정하십시오.", en: "⚠️ <b>Error: FMS communication FSS port error</b><br>✅ Action: There is no communication between the AGV and the FMS on the FSS-port. The AGV will keep trying to establish a connection, if this warning is still active after 30 seconds, reset the FSS-port TCP connection on the FMS." },
  "195": { ko: "⚠️ <b>오류: AGV 적재 중</b><br>✅ 조치: AGV에 하중이 감지되었습니다. 하중이 제거될 때까지 감속 주행을 계속합니다.", en: "⚠️ <b>Error: AGV carrying load</b><br>✅ Action: There is a load detected on the AGV. The AGV will continue driving with reduced speed until the load has been removed." },
  "196": { ko: "⚠️ <b>오류: 작업자가 전면 로드 센서를 영점으로 맞춤</b><br>✅ 조치: 작업자가 HMI를 사용하여 전면 로드 센서를 영점 조정했습니다. 단순 표시 경보이며 X초 후 사라집니다.", en: "⚠️ <b>Error: AGV load sensor front zeroed by operator</b><br>✅ Action: The front load sensor is zeroed by the operator using the HMI. This is only an indicative alarm and will disappear after X seconds." },
  "197": { ko: "⚠️ <b>오류: 작업자가 후면 로드 센서를 영점으로 맞춤</b><br>✅ 조치: 작업자가 HMI를 사용하여 후면 로드 센서를 영점 조정했습니다. 단순 표시 경보이며 X초 후 사라집니다.", en: "⚠️ <b>Error: AGV load sensor rear zeroed by operator</b><br>✅ Action: The rear load sensor is zeroed by the operator using the HMI. This is only an indicative alarm and will disappear after X seconds." },
  "210": { ko: "⚠️ <b>오류: IMU 정렬 설정 오류</b><br>✅ 조치: 내비게이션에서 IMU 정렬 오류를 감지했습니다. AGV 주행이 중지됩니다. HMI에서 IMU를 재시작하고, 오류 지속 시 AGV를 재시작하십시오.", en: "⚠️ <b>Error: IMU alignment set error</b><br>✅ Action: The navigation detects an error with the alignment of the IMU. The AGV will stop driving. Restart the IMU via the HMI. If this error remains present, restart the AGV. Check the wiring and functioning of the module." },
  "211": { ko: "⚠️ <b>오류: IMU 자이로스코프 보정 미완료</b><br>✅ 조치: AGV 움직임으로 인해 IMU 첫 번째 보정이 중단되었습니다. 주행을 멈추고 보정을 재시도합니다. FMS 리셋을 수행하십시오.", en: "⚠️ <b>Error: IMU gyroscope calibration not finished</b><br>✅ Action: The first calibration of the IMU is interrupted because of AGV movement. The AGV will stop driving and re-attempt calibration. Perform a FMS-reset." },
  "212": { ko: "⚠️ <b>오류: IMU 잘못된 응답</b><br>✅ 조치: 내비게이션이 IMU로부터 잘못된 응답을 받았습니다. HMI에서 IMU를 재시작하고, 지속 시 AGV를 재시작 및 배선을 확인하십시오.", en: "⚠️ <b>Error: IMU invalid response</b><br>✅ Action: The navigation received an invalid response from the IMU. The AGV will stop driving. Restart the IMU via the HMI. If this error remains present, restart the AGV. Check the wiring and functioning of the module." },
  "213": { ko: "⚠️ <b>오류: IMU 하드웨어 오류</b><br>✅ 조치: IMU가 하드웨어 오류를 감지했습니다. HMI에서 IMU를 재시작하고, 지속 시 AGV를 재시작 및 배선을 확인하십시오.", en: "⚠️ <b>Error: IMU hardware error</b><br>✅ Action: The IMU detects a hardware error. The AGV will stop driving. Restart the IMU via the HMI. If this error remains present, restart the AGV. Check the wiring and functioning of the module." },
  "214": { ko: "⚠️ <b>오류: IMU 내부 통신 오류</b><br>✅ 조치: IMU가 내부 오류를 감지했습니다. HMI에서 IMU를 재시작하고, 지속 시 AGV를 재시작 및 배선을 확인하십시오.", en: "⚠️ <b>Error: IMU internal communication error</b><br>✅ Action: The IMU detects an internal error. The AGV will stop driving. Restart the IMU via the HMI. If this error remains present, restart the AGV. Check the wiring and functioning of the module." },
  "215": { ko: "⚠️ <b>오류: IMU 보정 오류</b><br>✅ 조치: IMU가 보정 오류를 감지했습니다. HMI에서 IMU를 재시작하고, 지속 시 AGV를 재시작 및 배선을 확인하십시오.", en: "⚠️ <b>Error: IMU calibration error</b><br>✅ Action: The IMU detects a calibration error. The AGV will stop driving. Restart the IMU via the HMI. If this error remains present, restart the AGV. Check the wiring and functioning of the module." },
  "216": { ko: "⚠️ <b>오류: IMU 자이로스코프 범위 초과</b><br>✅ 조치: IMU가 자이로스코프 데이터 범위 초과를 감지했습니다. HMI에서 IMU를 재시작하고, 지속 시 AGV를 재시작 및 배선을 확인하십시오.", en: "⚠️ <b>Error: IMU gyroscope over range</b><br>✅ Action: The IMU detects over range gyroscope data. The AGV will stop driving. Restart the IMU via the HMI. If this error remains present, restart the AGV. Check the wiring and functioning of the module." },
  "217": { ko: "⚠️ <b>오류: IMU 가속도계 범위 초과</b><br>✅ 조치: IMU가 가속도계 데이터 범위 초과를 감지했습니다. HMI에서 IMU를 재시작하고, 지속 시 AGV를 재시작 및 배선을 확인하십시오.", en: "⚠️ <b>Error: IMU accelerometer over range</b><br>✅ Action: The IMU detects over range accelerometer data. The AGV will stop driving. Restart the IMU via the HMI. If this error remains present, restart the AGV. Check the wiring and functioning of the module." },
  "218": { ko: "⚠️ <b>오류: IMU 대기 모드</b><br>✅ 조치: IMU가 대기 모드입니다. HMI에서 IMU를 재시작하고, 지속 시 AGV를 재시작 및 배선을 확인하십시오.", en: "⚠️ <b>Error: IMU standby mode</b><br>✅ Action: The IMU is in standby mode. The AGV will stop driving. Restart the IMU via the HMI. If this error remains present, restart the AGV. Check the wiring and functioning of the module." },
  "219": { ko: "⚠️ <b>오류: IMU 자이로스코프 데이터 예상치 못함</b><br>✅ 조치: IMU가 예상치 못한 데이터를 전송합니다. 주행을 멈추고 보정을 재시도합니다. FMS 리셋을 수행하십시오.", en: "⚠️ <b>Error: IMU gyroscope data unexpected</b><br>✅ Action: The IMU is sending unexpected data. The AGV will stop driving and re-attempt calibration. Perform a FMS-reset." },
  "220": { ko: "⚠️ <b>오류: 지원되지 않는 IMU 유형</b><br>✅ 조치: 감지된 IMU가 지원되지 않습니다. 지원되는 IMU를 설치하십시오.", en: "⚠️ <b>Error: IMU type is not supported</b><br>✅ Action: The IMU that has been detected is not supported. Install a supported IMU." },
  "221": { ko: "⚠️ <b>오류: IMU 통신 오류</b><br>✅ 조치: 내비게이션에서 IMU와의 통신 오류를 감지했습니다. AGV를 완전히 재시작하고 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: IMU communication error</b><br>✅ Action: The navigation detects a communication error with the IMU and has no communication with the IMU. The AGV will stop driving. Restart the AGV completely. If this error remains present, restart the AGV. Check the wiring and functioning of the module." },
  "235": { ko: "⚠️ <b>오류: 원격 IO 모듈 1 통신 오류</b><br>✅ 조치: 원격 IO 모듈 1에서 CAN 통신 오류가 감지되었습니다. AGV를 재설정하고, 지속 시 재시작 및 CAN 버스와 배선을 점검하십시오.", en: "⚠️ <b>Error: Remote IO module 1 communication error</b><br>✅ Action: A CAN communication error from remote IO module 1 has been detected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "236": { ko: "⚠️ <b>오류: 원격 IO 모듈 2 통신 오류</b><br>✅ 조치: 원격 IO 모듈 2에서 CAN 통신 오류가 감지되었습니다. AGV를 재설정하고, 지속 시 재시작 및 CAN 버스와 배선을 점검하십시오.", en: "⚠️ <b>Error: Remote IO module 2 communication error</b><br>✅ Action: A CAN communication error from remote IO module 2 has been detected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "237": { ko: "⚠️ <b>오류: 원격 IO 모듈 3 통신 오류</b><br>✅ 조치: 원격 IO 모듈 3에서 CAN 통신 오류가 감지되었습니다. AGV를 재설정하고, 지속 시 재시작 및 CAN 버스와 배선을 점검하십시오.", en: "⚠️ <b>Error: Remote IO module 3 communication error</b><br>✅ Action: A CAN communication error from remote IO module 3 has been detected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "238": { ko: "⚠️ <b>오류: 원격 IO 모듈 4 통신 오류</b><br>✅ 조치: 원격 IO 모듈 4에서 CAN 통신 오류가 감지되었습니다. AGV를 재설정하고, 지속 시 재시작 및 CAN 버스와 배선을 점검하십시오.", en: "⚠️ <b>Error: Remote IO module 4 communication error</b><br>✅ Action: A CAN communication error from remote IO module 4 has been detected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "239": { ko: "⚠️ <b>오류: 원격 IO 모듈 5 통신 오류</b><br>✅ 조치: 원격 IO 모듈 5에서 CAN 통신 오류가 감지되었습니다. AGV를 재설정하고, 지속 시 재시작 및 CAN 버스와 배선을 점검하십시오.", en: "⚠️ <b>Error: Remote IO module 5 communication error</b><br>✅ Action: A CAN communication error from remote IO module 5 has been detected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "240": { ko: "⚠️ <b>오류: 원격 IO 모듈 6 통신 오류</b><br>✅ 조치: 원격 IO 모듈 6에서 CAN 통신 오류가 감지되었습니다. AGV를 재설정하고, 지속 시 재시작 및 CAN 버스와 배선을 점검하십시오.", en: "⚠️ <b>Error: Remote IO module 6 communication error</b><br>✅ Action: A CAN communication error from remote IO module 6 has been detected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "245": { ko: "⚠️ <b>오류: 후면 트랙션 인버터 통신 오류</b><br>✅ 조치: 후면 트랙션 인버터에서 CAN 통신 오류가 감지되었습니다. AGV를 재설정하고 배선 등을 점검하십시오.", en: "⚠️ <b>Error: Traction inverter rear communication error</b><br>✅ Action: A CAN communication error from the rear traction inverter has been detected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "246": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 통신 오류</b><br>✅ 조치: 전면 트랙션 인버터에서 CAN 통신 오류가 감지되었습니다. AGV를 재설정하고 배선 등을 점검하십시오.", en: "⚠️ <b>Error: Traction inverter front communication error</b><br>✅ Action: A CAN communication error from the front traction inverter has been detected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "248": { ko: "⚠️ <b>오류: 양쪽 트랙션 인버터 통신 오류</b><br>✅ 조치: 두 트랙션 인버터 모두에서 CAN 통신 오류가 감지되었습니다. AGV를 재설정하고 배선 등을 점검하십시오.", en: "⚠️ <b>Error: Traction inverter both communication error</b><br>✅ Action: A CAN communication error from both traction inverters has been detected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "253": { ko: "⚠️ <b>오류: VCU CAN0 통신 오류</b><br>✅ 조치: VCU의 CAN0에서 CAN 통신 오류가 감지되었습니다. AGV를 재설정하고 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: VCU CAN0 communication error</b><br>✅ Action: A CAN communication error on CAND of the VCU has been detected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "254": { ko: "⚠️ <b>오류: VCU CAN1 통신 오류</b><br>✅ 조치: VCU의 CAN1에서 CAN 통신 오류가 감지되었습니다. AGV를 재설정하고 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: VCU CAN1 communication error</b><br>✅ Action: A CAN communication error on CAN1 of the VCU has been detected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "255": { ko: "⚠️ <b>오류: VCU CAN2 통신 오류</b><br>✅ 조치: VCU의 CAN2에서 CAN 통신 오류가 감지되었습니다. AGV를 재설정하고 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: VCU CAN2 communication error</b><br>✅ Action: A CAN communication error on CAN2 of the VCU has been detected. Reset the AGV. If this error remains present, restart the AGV. Check the CAN bus (quality), wiring and functioning of the module." },
  "268": { ko: "⚠️ <b>오류: 전면 장애물 감지 미보정</b><br>✅ 조치: 전면 장애물 감지가 아직 보정되지 않았습니다. HMI 버튼과 올바른 절차를 사용하여 보정하십시오.", en: "⚠️ <b>Error: Obstacle detection front not calibrated</b><br>✅ Action: The obstacle detection front has not been calibrated yet. Calibrate the front obstacle detection using the button on the HMI in combination with the correct procedure." },
  "269": { ko: "⚠️ <b>오류: 후면 장애물 감지 미보정</b><br>✅ 조치: 후면 장애물 감지가 아직 보정되지 않았습니다. HMI 버튼과 올바른 절차를 사용하여 보정하십시오.", en: "⚠️ <b>Error: Obstacle detection rear not calibrated</b><br>✅ Action: The obstacle detection rear has not been calibrated yet. Calibrate the rear obstacle detection using the button on the HMI in combination with the correct procedure." },
  "270": { ko: "⚠️ <b>오류: 전면 장애물 감지 과다 감지</b><br>✅ 조치: 장애물이 너무 많이 감지되었습니다. 해당 감지 데이터는 무시되며 감속 주행을 계속합니다. 센서 상태를 확인하고 더러우면 청소하십시오.", en: "⚠️ <b>Error: Obstacle detection front detects too much obstacles</b><br>✅ Action: The obstacle detection front detects too much objects. The detection data will be ignored and the AGV will continue driving with reduced speed. Check the functioning of the obstacle detection and clean the sensor if dirty." },
  "271": { ko: "⚠️ <b>오류: 후면 장애물 감지 과다 감지</b><br>✅ 조치: 장애물이 너무 많이 감지되었습니다. 해당 감지 데이터는 무시되며 감속 주행을 계속합니다. 센서 상태를 확인하고 더러우면 청소하십시오.", en: "⚠️ <b>Error: Obstacle detection rear detects too much obstacles</b><br>✅ Action: The obstacle detection rear detects too much objects. The detection data will be ignored and the AGV will continue driving with reduced speed. Check the functioning of the obstacle detection and clean the sensor if dirty." },
  "272": { ko: "⚠️ <b>오류: 전면 장애물 감지 자체 테스트 실패</b><br>✅ 조치: 자체 테스트가 실패했습니다. 테스트가 통과될 때까지 AGV가 감속 주행합니다. 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: Obstacle detection front selftest failed</b><br>✅ Action: The self-test for obstacle detection front has failed. The AGV continues driving at reduced speed until the self-test passes. Check the functioning of the module." },
  "273": { ko: "⚠️ <b>오류: 후면 장애물 감지 자체 테스트 실패</b><br>✅ 조치: 자체 테스트가 실패했습니다. 테스트가 통과될 때까지 AGV가 감속 주행합니다. 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: Obstacle detection rear selftest failed</b><br>✅ Action: The self-test for obstacle detection rear has failed. The AGV continues driving at reduced speed until the self-test passes. Check the functioning of the module." },
  "276": { ko: "⚠️ <b>오류: 장애물 감지 비상 정지 해제 후 12m 저속 주행</b><br>✅ 조치: 비상 정지가 해제되었습니다. 다음 12미터 동안 감속 주행하며, 이후에는 정상 속도로 주행합니다.", en: "⚠️ <b>Error: Obstacle dectection emergency stop lifted driving slow for 12 meters</b><br>✅ Action: The obstacle detection emergency stop is lifted. The AGV will continue at reduced speed for the next 12 metres. After this, the AGV will continue driving at \"normal\" speed again." },
  "349": { ko: "⚠️ <b>오류: 전면 좌측 조향각 인코더 한계 초과</b><br>✅ 조치: 인코더 값이 최대 기계적 허용치보다 큽니다. 조향각 및 축 손상을 확인하고 정렬을 기계적이나 HMI를 통해 수정하십시오.", en: "⚠️ <b>Error: Steering angle encoder front left exceeds limit</b><br>✅ Action: The front left steering angle encoder gives a value higher than the maximum mechanically possible value. Check the steering angle, and axle for damage. Check the steering alignment and correct it mechanically and/or via the HMI if necessary." },
  "350": { ko: "⚠️ <b>오류: 후면 좌측 조향각 인코더 한계 초과</b><br>✅ 조치: 인코더 값이 최대 기계적 허용치보다 큽니다. 조향각 및 축 손상을 확인하고 정렬을 기계적이나 HMI를 통해 수정하십시오.", en: "⚠️ <b>Error: Steering angle encoder rear left exceeds limit</b><br>✅ Action: The rear left steering angle encoder gives a value higher than the maximum mechanically possible value. Check the steering angle, and axle for damage. Check the steering alignment and correct it mechanically and/or via the HMI if necessary." },
  "351": { ko: "⚠️ <b>오류: 전면 우측 조향각 인코더 한계 초과</b><br>✅ 조치: 인코더 값이 최대 기계적 허용치보다 큽니다. 조향각 및 축 손상을 확인하고 정렬을 기계적이나 HMI를 통해 수정하십시오.", en: "⚠️ <b>Error: Steering angle encoder front right exceeds limit</b><br>✅ Action: The front right steering angle encoder gives a value higher than the maximum mechanically possible value. Check the steering angle, and axle for damage. Check the steering alignment and correct it mechanically and/or via the HMI if necessary." },
  "352": { ko: "⚠️ <b>오류: 후면 우측 조향각 인코더 한계 초과</b><br>✅ 조치: 인코더 값이 최대 기계적 허용치보다 큽니다. 조향각 및 축 손상을 확인하고 정렬을 기계적이나 HMI를 통해 수정하십시오.", en: "⚠️ <b>Error: Steering angle encoder rear right exceeds limit</b><br>✅ Action: The rear right steering angle encoder gives a value higher than the maximum mechanically possible value. Check the steering angle, and axle for damage. Check the steering alignment and correct it mechanically and/or via the HMI if necessary." },
  "353": { ko: "⚠️ <b>오류: 전면 조향각 인코더 편차 과다</b><br>✅ 조치: 전면 축의 조향각 인코더 간 차이가 너무 큽니다. 축 손상을 확인하고 조향 정렬, CAN 버스, 배선을 점검하십시오.", en: "⚠️ <b>Error: Steering angle encoders front difference too high</b><br>✅ Action: The difference between the steering angle encoders on the front axle is too large. Check the steering angles, and the axle for damage. Check the steering alignment and correct it mechanically and/or via the HMI if necessary. Check the CAN bus (quality), wiring and functioning of the modules." },
