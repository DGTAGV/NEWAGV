  "354": { ko: "⚠️ <b>오류: 후면 조향각 인코더 편차 과다</b><br>✅ 조치: 후면 축의 조향각 인코더 간 차이가 너무 큽니다. 축 손상을 확인하고 조향 정렬, CAN 버스, 배선을 점검하십시오.", en: "⚠️ <b>Error: Steering angle encoders rear difference too high</b><br>✅ Action: The difference between the steering angle encoders on the rear axle is too large. Check the steering angles, and the axle for damage. Check the steering alignment and correct it mechanically and/or via the HMI if necessary. Check the CAN bus (quality), wiring and functioning of the modules." },
  "355": { ko: "⚠️ <b>오류: 전면 조향각 인코더 모두 오류</b><br>✅ 조치: 전면 축 인코더 두 개 모두 오류이거나 조향각이 너무 큽니다. 조향각 및 축 손상, 배선과 모듈을 확인하십시오.", en: "⚠️ <b>Error: Steering angle encoders front both error</b><br>✅ Action: Both steering angle encoders on the front axle have an error or the steering angle is too large. Check the steering angle, and the axle for damage. Check the CAN bus (quality), wiring and functioning of the modules." },
  "356": { ko: "⚠️ <b>오류: 후면 조향각 인코더 모두 오류</b><br>✅ 조치: 후면 축 인코더 두 개 모두 오류이거나 조향각이 너무 큽니다. 조향각 및 축 손상, 배선과 모듈을 확인하십시오.", en: "⚠️ <b>Error: Steering angle encoders rear both error</b><br>✅ Action: Both steering angle encoders on the rear axle have an error or the steering angle is too large. Check the steering angle and the axle for damage. Check the CAN bus (quality), wiring and functioning of the modules." },
  "359": { ko: "⚠️ <b>오류: 유압 조향 압력 부족</b><br>✅ 조치: 원활한 조향을 위한 유압 시스템 압력이 너무 낮습니다. 유압 펌프, 인버터, 누출, 질소 압력 및 밸브를 확인하십시오.", en: "⚠️ <b>Error: Hydraulic oil pressure insufficient too steer</b><br>✅ Action: Hydraulic system pressure is too low for adequate steering. Check the hydraulic system for functionality pump and inverter, leaks, accumulator nitrogen pressure, faulty sensors and valves." },
  "361": { ko: "⚠️ <b>오류: 전면 조향 밸브 잘못 활성화됨</b><br>✅ 조치: 잘못된 전면 조향 밸브가 활성화되었습니다. 모듈 기능 및 배선을 점검하십시오.", en: "⚠️ <b>Error: Valve steering front wrong one active</b><br>✅ Action: The wrong valve for front steering is active. Check the modules for functionality and wiring." },
  "362": { ko: "⚠️ <b>오류: 후면 조향 밸브 잘못 활성화됨</b><br>✅ 조치: 잘못된 후면 조향 밸브가 활성화되었습니다. 모듈 기능 및 배선을 점검하십시오.", en: "⚠️ <b>Error: Valve steering rear wrong one active</b><br>✅ Action: The wrong valve for rear steering is active. Check the modules for functionality and wiring." },
  "363": { ko: "⚠️ <b>오류: 그리스 윤활제 부족</b><br>✅ 조치: 자동 그리스 윤활 탱크의 그리스 레벨이 낮습니다. 적절한 그리스를 탱크에 보충하십시오.", en: "⚠️ <b>Error: Grease lubrication grease level low</b><br>✅ Action: The grease level in the automatic grease lubrication reservoir is low. Top up the reservoir with suitable grease." },
  "366": { ko: "⚠️ <b>오류: 유압 브레이크 압력 센서 오류</b><br>✅ 조치: 유압 브레이크 압력 센서 피드백에 진단 결함이 있습니다. VCU 배선 및 시스템 손상 여부를 확인하고 재시작 후 반복되는지 확인하십시오.", en: "⚠️ <b>Error: Hydraulic oil sensor brake pressure error</b><br>✅ Action: There is a diagnostics fault on feedback of the hydraulic oil brake pressure sensor. Check the wiring from VCU to the module and check the system for faults or damage. If not there, restart the AGV and check for recurring errors." },
  "367": { ko: "⚠️ <b>오류: 비례 제어 밸브 제동 오류</b><br>✅ 조치: 비례 제동용 유압 밸브 제어에 진단 결함이 있습니다. VCU 배선 및 시스템 손상 여부를 점검하고 AGV를 재시작하십시오.", en: "⚠️ <b>Error: Valve proportional braking error</b><br>✅ Action: There is a diagnostics fault on the control of the hydraulic valve for proportional braking. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
  "368": { ko: "⚠️ <b>오류: 주차 브레이크 밸브 오류</b><br>✅ 조치: 핸드브레이크 유압 밸브 제어에 진단 결함이 있습니다. VCU 배선을 점검하고 이상 없으면 AGV를 재시작하십시오.", en: "⚠️ <b>Error: Valve park brake error</b><br>✅ Action: There is a diagnostics fault on the control of the hydraulic valve for the handbrake. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors" },
  "372": { ko: "⚠️ <b>오류: 감속기 생성전력 초과로 기계식 보조 브레이크 작동</b><br>✅ 조치: 배터리가 제동 중 생성된 에너지를 모두 흡수할 수 없어 기계식 브레이크가 사용됩니다. 자주 발생하면 브레이크 마모 및 배터리 결함을 점검하십시오.", en: "⚠️ <b>Error: AGV proportional braking active</b><br>✅ Action: The AGV's battery cannot absorb all the energy generated during braking. To make up for this difference, the mechanical brakes are also used to brake the vehicle. If this happens more often, check the brakes for wear and the battery system for defects" },
  "373": { ko: "⚠️ <b>오류: 비상 정지 활성화</b><br>✅ 조치: 비상 정지 신호가 전달되었습니다. 비상 정지 버튼이 눌렸는지 또는 신호 손실인지 확인하고 안전 확보 후 재설정하십시오.", en: "⚠️ <b>Error: Emergency stop active</b><br>✅ Action: An emergency stop signal has failed. Check the reason for pressing an emergency stop, or loss of signal, and reset the vehicle when the situation is safe again" },
  "377": { ko: "⚠️ <b>오류: 아이솔레이션 모니터링 경고</b><br>✅ 조치: 600V 시스템 절연 측정값이 경고 한계 아래로 떨어졌습니다. 전기 전문가에게 점검을 의뢰하고 손상을 복구 및 부품을 교체하십시오.", en: "⚠️ <b>Error: Isolation monitoring warning</b><br>✅ Action: The measured isolation value of the 600V system has fallen below the warning limit. Have an electrical specialist check the insulation value of all AGV (600V) systems. Also check the system for damage. Repair the system and replace any defective components" },
  "378": { ko: "⚠️ <b>오류: 아이솔레이션 모니터링 오류</b><br>✅ 조치: 600V 시스템 절연 측정값이 오류 한계 아래로 떨어졌습니다. 즉시 AGV 사용을 멈추고 600V 시스템을 끄십시오. 전문가에게 점검 및 수리를 의뢰하십시오.", en: "⚠️ <b>Error: Isolation monitoring error</b><br>✅ Action: The measured isolation value of the 600V system has fallen below the error limit. Do not use the AGV and switch off all 600V systems. Have an electrical specialist check the insulation value of all AGV (600V) systems. Also check the system for damage. Repair the system and replace any defective components." },
  "379": { ko: "⚠️ <b>오류: 유압 오일 압력 과다</b><br>✅ 조치: 유압 오일 압력이 너무 높습니다. 펌프, 인버터 기능, 어큐뮬레이터 질소 압력 및 밸브를 확인하십시오.", en: "⚠️ <b>Error: Hydraulic oil pressure too high</b><br>✅ Action: The hydraulic oil pressure is too high. Check the hydraulic system for functionality pump and inverter, accumulator nitrogen pressure, faulty sensors and valves. " },
  "381": { ko: "⚠️ <b>오류: 유압 오일 온도 낮음</b><br>✅ 조치: 유압 오일 온도가 너무 낮습니다. 오일 순환을 점검하고 온도를 높이십시오.", en: "⚠️ <b>Error: Hydraulic oil temperature low</b><br>✅ Action: The hydraulic oil temperature is too low. Check the hydraulic oil circulation and try to heat up the oil" },
  "400": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 비상 정지</b><br>✅ 조치: 인버터 비상 정지 입력 1 또는 2가 활성화되었습니다. 비상 정지 원인을 점검하고 공급업체 설명서를 참조하십시오.", en: "⚠️ <b>Error: Traction inverter front emergency stop</b><br>✅ Action: The inverter emergency stop input 1 or 2 activated the signal pin: 3 or pin 24 of the XI connector is deactivated (error code 25/26). Check the cause of the emergency stop. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "401": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 펌웨어 오류</b><br>✅ 조치: 인버터 펌웨어 오류가 감지되었습니다. 파라미터를 초기화하거나 펌웨어를 재설치하십시오. 지속 시 제조업체 점검이 필요합니다.", en: "⚠️ <b>Error: Traction inverter front firmware error</b><br>✅ Action: The inverter has detected a firmware error (error code 38/50), Reset the inverter parameters to factory settings or reinstall the firmware. Refer to the appropriate diagnostic tools and (troubleshooting) manual from the supplier for more information on this error. If this error remains present, the inverter should be inspected by the manufacturer" },
  "402": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 신호 접근 오류</b><br>✅ 조치: 인버터 신호 오류가 감지되었습니다. 공급업체 설명서를 참조하고 도움이 필요하면 제조업체에 문의하십시오.", en: "⚠️ <b>Error: Traction inverter front signal access error</b><br>✅ Action: Inverter has detected a signal error. Refer to the appropriate diagnostic tools and (troubleshooting) manual from the supplier for more information on this error. Contact the manufacturer for assistance" },
  "403": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 CPU 부하 과다</b><br>✅ 조치: 인버터 CPU 부하가 너무 높습니다. 진단 도구 및 설명서를 참조하고 제조업체에 문의하십시오.", en: "⚠️ <b>Error: Traction inverter front CPU load too high</b><br>✅ Action: The inverter has detected an excessive CPU load (error code 46) Refer to appropriate diagnostic tools and supplier (troubleshooting manual for more information on this error. Contact the manufacturer for assistance" },
  "404": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 통신 타임아웃</b><br>✅ 조치: VCU로부터 수신되는 CAN 메시지 타임아웃이 발생했습니다. CAN 버스 품질, 배선, 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: Traction inverter front communication timeout</b><br>✅ Action: The inverter that detected a CAN communication timeout on the incoming CAN bus messages from the VCU (error code 48). Check the CAN bus (quality), wiring and functioning of the modules. Refer to appropriate diagnostic tools and suppliers (troubleshooting) manual for more information on this fault" },
  "406": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 외부 온도 오류</b><br>✅ 조치: 센서 중 하나에서 최대 허용치 이상의 온도가 측정되었습니다. 인버터 온도 및 냉각수 순환을 점검하고 식히십시오.", en: "⚠️ <b>Error: Traction inverter front external temperature error</b><br>✅ Action: The inverter has measured a temperature on one of the external FT100/PT1000 sensors that is higher than the maximum value in the parameters (fault code 57) Check the inverter temperature, coolant level and fluid circulation, and allow the system to cool down. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on thes fault" },
  "407": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 하드웨어 오류</b><br>✅ 조치: 인버터 하드웨어 오류가 발생했습니다. 심각한 오류일 수 있으므로 재사용 전 반드시 점검하십시오.", en: "⚠️ <b>Error: Traction inverter front hardware error</b><br>✅ Action: The inverter has detected a hardware error. This may be a severe fault that requires inspection before restarting the machine. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information about this error. This may be a serious hardware fault inspect the inverter first before using in again." },
  "408": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 DC 링크 과전압</b><br>✅ 조치: DC 링크의 전압이 허용된 최대 한계를 초과했습니다. DC 링크를 점검하고 진단 도구를 참조하십시오.", en: "⚠️ <b>Error: Traction inverter front DCLink overvoltage</b><br>✅ Action: The inverter has measured a voltage on the DC link that is higher than the upper limit set in the parameters.or hardware maximum technically allowed (fault code 23). Check the DC link. Refer to appropriate diagnostic tool and supplier (troubleshooting) manual for more information on this error" },
  "409": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 DC 링크 저전압</b><br>✅ 조치: DC 링크의 전압이 설정된 최소 한계보다 낮습니다. DC 링크를 점검하고 진단 도구를 참조하십시오.", en: "⚠️ <b>Error: Traction inverter front DCLink undervoltage</b><br>✅ Action: The inverter has measured a voltage on the DC link that is lower than the lower limit set in the parameters (fault code 29) Check the DC link. Refer to appropriate diagnostic tools and supplier (troubleshooting manual for more information on this error" },
  "410": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 애플리케이션 오류</b><br>✅ 조치: 인버터에서 애플리케이션 오류가 감지되었습니다. 시스템 파라미터, CAN 버스, 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: Traction inverter front application error</b><br>✅ Action: The inverter has detected an application error (error code 36). Check the system parameters and check the CAN bus (quality), wriring and functioning of the modules. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this error." },
  "411": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 외부 온도 센서 오류</b><br>✅ 조치: 외부 온도 센서 중 하나에 결함이 발생했습니다. 문제 해결 설명서 및 진단 도구를 참조하십시오.", en: "⚠️ <b>Error: Traction inverter front external temperature sensor error</b><br>✅ Action: The inverter has detected a circuit fault on one of the extemal temperature sensors (fault code 165/166), refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this error," },
  "412": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 하드웨어 과전류</b><br>✅ 조치: 위상 중 하나에서 과전류가 측정되었습니다. 시스템 동작, 배선 및 시스템 기능을 점검하십시오.", en: "⚠️ <b>Error: Traction inverter front hardware overcurrent</b><br>✅ Action: The inverter has measured overcurrent on one of the phases (Fault code 2/3/4) Check the system behaviour, wiring and system functionality: Refer to appropriate diagnostic tools and supplier troubleshooting manual for more information on this error." },
  "413": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 쇼트</b><br>✅ 조치: 위상 중 하나에 단락(합선)이 감지되었습니다. 모터, 케이블 및 인버터 배선을 점검하십시오. 재사용 전 인버터를 검사해야 하는 심각한 문제입니다.", en: "⚠️ <b>Error: Traction inverter front short circuit</b><br>✅ Action: The inverter has detected a short circuit on one of the phases (fault code 10/11/12/13/14/15) Check the wiring of the motor, phase cables and inverter. This is a hardware problem Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this fault. The is a severe problem, mspect the inverter before using it again." },
  "414": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 브릿지 오류</b><br>✅ 조치: 동일한 위상의 양쪽 브릿지가 동시에 닫혔습니다. 즉시 인버터 사용을 중지하고 배선을 점검하십시오. 재사용 전 검사가 필수입니다.", en: "⚠️ <b>Error: Traction inverter front inverter bridge error</b><br>✅ Action: The inverter closed both bridges of the same phase at the same time: Stop wing the inverter (fault code 5 Check the wiring of the motor, phase cables and inverter. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault. This may be a serious fault inspect the inverter before using it again" },
  "415": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 온도 과열</b><br>✅ 조치: 인버터 내부 GBT 온도가 최대 설정값을 초과했습니다. 인버터 온도 및 냉각 시스템을 점검하고 시스템을 식히십시오.", en: "⚠️ <b>Error: Traction inverter front inverter overtemperature</b><br>✅ Action: The inverter has measured an GBT temperature higher than the sel maximum value in the parameters (fault code 34). Check the inverter temperature, coolant level and fhuid circulation, and allow the system to cool down Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "416": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 소프트웨어 과전류</b><br>✅ 조치: 위상 중 하나의 전류가 파라미터 최대값을 초과했습니다. 시스템 동작, 배선 및 기능을 점검하십시오.", en: "⚠️ <b>Error: Traction inverter front software overcurrent</b><br>✅ Action: The inverter that measured a current on one of the phases that is higher than the maximum value set in the parameters fault code 27). Check the system behaviour, wring and system functionality. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on the fault" },
  "417": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 과속</b><br>✅ 조치: 모터 속도가 설정된 파라미터 한계를 초과하거나 미달했습니다. 진단 도구 및 문제 해결 설명서를 참조하십시오.", en: "⚠️ <b>Error: Traction inverter front overspeed</b><br>✅ Action: The inverter has measured a speed on the motor that is higher or lower than the set maximum values in the parameters (error code 30). Refer to appropriate diagnostic tools and suppliers (troubleshooting) manual for more information on this fault" },
  "418": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 과주파수</b><br>✅ 조치: 인버터 출력 주파수가 파라미터에 설정된 한계보다 높습니다. 진단 도구 및 설명서를 참조하십시오.", en: "⚠️ <b>Error: Traction inverter front overfrequency</b><br>✅ Action: The inverter output frequency is higher than the limit set in the parameters (fault code 61). Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "419": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 위상 손실</b><br>✅ 조치: 출력 위상 중 하나의 전류가 다른 위상에 비해 현저히 낮습니다. 배선을 점검하고 전원 케이블이 단선되지 않았는지 확인하십시오.", en: "⚠️ <b>Error: Traction inverter front phase loss</b><br>✅ Action: The inverter has measured a current on one of the output phases that is significantly lower than an the athes phases (fault code 63). Check the wiring, possibly one of the power cables is no longer connected Refer to appropriate diagnostic tools and supplier's (troubleshooting manual for more information loss this fault." },
  "420": { ko: "⚠️ <b>오류: 전면 트랙션 인버터 접지 오류</b><br>✅ 조치: 인버터의 총 출력 전류가 설정된 최대값을 초과했습니다. 공급업체의 문제 해결 설명서를 참조하여 점검하십시오.", en: "⚠️ <b>Error: Traction inverter front earth error</b><br>✅ Action: The inverter has total output current higher than the maximum value set in the parameters (error code 62). Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this error." },       
      "421": { ko: "⚠️ <b>오류: 트랙션 인버터 전면 병렬 통신 오류</b><br>✅ 조치: 인버터 SYNC 링크에 오류가 발생했습니다(오류 코드 86). 시스템의 SYNC 링크 배선 차폐 및 접지를 점검하십시오. 이 결함에 대한 자세한 내용은 적절한 진단 도구 및 공급업체(문제 해결) 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Traction inverter front parallel communication error</b><br>✅ Action: The inverter SYNC link has gone into error (error code 86). Check the SYNC link wiring, shielding and earthing of the system. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this fault" },
  "422": { ko: "⚠️ <b>오류: 트랙션 인버터 전면 리졸버 오류</b><br>✅ 조치: 인버터가 리졸버에서 오류를 감지했습니다(오류 코드 163). 리졸버 배선을 점검하고 매개변수를 설정한 뒤 센서를 다시 보정하십시오. 이 결함에 대한 자세한 내용은 적절한 진단 도구 및 공급업체 문제 해결 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Traction inverter front resolver error</b><br>✅ Action: The inverter detects an error on the resolver (error code 163) Check resolver wiring, sett parameters and calibrate the sensor again Refer to appropriate diagnostic tools and supplier troubleshooting manual for me information on this fault" },
  "423": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 비상 정지</b><br>✅ 조치: 인버터 비상 정지 입력 1 또는 2가 활성화되었습니다(오류 코드 25/26). 비상 정지 원인을 확인하십시오. 이 결함에 대한 자세한 내용은 적절한 진단 도구 및 공급업체 문제 해결 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Traction inverter rear emergency stop</b><br>✅ Action: The inverter emergency stop input 1 or 2 activated the signal pin: 3 or pin 24 of the XI connector is deactivated error code 25/26) Check the cause of the emergency stop. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "424": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 펌웨어 오류</b><br>✅ 조치: 인버터가 펌웨어 오류를 감지했습니다(오류 코드 38/50). 인버터 매개변수를 공장 설정으로 재설정하거나 펌웨어를 재설치하십시오. 이 오류가 지속되면 제조업체의 검사를 받아야 합니다.", en: "⚠️ <b>Error: Traction inverter rear firmware error</b><br>✅ Action: The inverter has detected a firmware error (error code 38/50). Reset the inverter parameters to factory settings or reinstall the firmware. Refer to the appropriate diagnostic tools and troubleshooting) manual from the supplier for more information on this error if this error remains present, the inverter should be inspected by the manufacturer" },
  "425": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 신호 액세스 오류</b><br>✅ 조치: 인버터가 신호 오류를 감지했습니다. 이 오류에 대한 자세한 내용은 진단 도구 및 문제 해결 매뉴얼을 참조하십시오. 오류가 지속되면 제조업체에 문의하십시오.", en: "⚠️ <b>Error: Traction inverter rear signal access error</b><br>✅ Action: The inverter has detected a signal error lefer to the appropriate diagnostic tools and troubleshooting) manual from the supplier for more information on this error. Contact the manufacturer if this error remains present" },
  "426": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 CPU 부하 과다</b><br>✅ 조치: 인버터가 과도한 CPU 부하를 감지했습니다(오류 코드 46). 진단 도구 및 매뉴얼을 참조하고 도움이 필요하면 제조업체에 문의하십시오.", en: "⚠️ <b>Error: Traction inverter rear CPU load too high</b><br>✅ Action: The inverter has detected an excessive CPU load (error code 46) Refer to appropriate diagnostic tools and supplier (troubleshooting manual for more information on this error. Contact the manufacturer for assistance" },
  "427": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 통신 시간 초과</b><br>✅ 조치: 인버터가 수신 CAN 메시지에서 CAN 통신 시간 초과를 감지했습니다. CAN 버스 품질, 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: Traction inverter rear communication timeout</b><br>✅ Action: The inverter has detected a CAN communication timeout on the incoming CAN bus messages from the VCU error code 48). Check the CAN bus (quality), wiring and functioning of the modules. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "429": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 외부 온도 오류</b><br>✅ 조치: 외부 센서 중 하나에서 측정된 온도가 설정된 최대값을 초과했습니다. 인버터 온도, 냉각수 수위 등을 점검하고 시스템을 식히십시오.", en: "⚠️ <b>Error: Traction inverter rear external temperature error</b><br>✅ Action: The inverter has measured a temperature on one of the external PT100/PT1000 sensors that higher than the set maximum value in the parameters (fault code 57) Check the invert temperature, coolant level and fluid cicculation, and allow the system to cool down. Refer to appropriate diagnostic tools and supplier's troubleshooting manual for more information on this fault" },
  "430": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 하드웨어 오류</b><br>✅ 조치: 인버터가 하드웨어 오류를 감지했습니다. 장비를 다시 시작하기 전에 검사가 필요한 심각한 결함일 수 있습니다. 인버터를 먼저 검사하십시오.", en: "⚠️ <b>Error: Traction inverter rear hardware error</b><br>✅ Action: The inverter has detected a hardware error. This may be a severe fault that requires inspection before restarting the machine. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information about this error. This may be a serious hardware fault inspect the inverter first before using in again." },
  "431": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 DC링크 과전압</b><br>✅ 조치: 인버터가 DC 링크에서 허용되는 상한선을 초과하는 전압을 측정했습니다. DC 링크를 점검하십시오.", en: "⚠️ <b>Error: Traction inverter rear DCLink overvoltage</b><br>✅ Action: The inverter has measured a voltage on the DC link that is higher than the upper limit set in the parameters or hardware maximum technically allowed (fault code 28). Check the DC link. Refer to appropriate diagnostic tools and supplier troubleshooting) manual for more information on this error" },
  "432": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 DC링크 저전압</b><br>✅ 조치: 인버터가 DC 링크에서 하한선보다 낮은 전압을 측정했습니다. DC 링크를 점검하십시오.", en: "⚠️ <b>Error: Traction inverter rear DCLink undervoltage</b><br>✅ Action: The inverter has measured a voltage on the DC link that is lower than the lower limit set in the parameters (fault code 29) Check the DC link. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this error" },
  "433": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 애플리케이션 오류</b><br>✅ 조치: 인버터가 애플리케이션 오류를 감지했습니다. 시스템 매개변수를 확인하고 CAN 버스(품질), 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: Traction inverter rear application error</b><br>✅ Action: The inverter has detected an application error perror code 36) Check the system parameters and check the CAN bus (quality), wiring and functioning of the modules. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this error." },
  "434": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 외부 온도 센서 오류</b><br>✅ 조치: 인버터가 외부 온도 센서 중 하나에서 회로 결함을 감지했습니다(오류 코드 165/166). 진단 도구 및 문제 해결 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Traction inverter rear external temperature sensor error</b><br>✅ Action: The inverter has detected a circuit fault on one of the external temperature sensors (fault code 165/166). Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this error" },
  "435": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 하드웨어 과전류</b><br>✅ 조치: 인버터가 한 위상에서 과전류를 측정했습니다. 시스템 동작, 배선 및 기능을 점검하십시오.", en: "⚠️ <b>Error: Traction inverter rear hardware overcurrent</b><br>✅ Action: The inverter that measured overcurrent on one of the phases (fault code 2/3/41 Check the system behaviour, wiring and system functionality: Refer to appropriate diagnostic tools and supplier (troubleshooting manual for more information on this error." },
  "436": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 단락</b><br>✅ 조치: 인버터가 한 위상에서 단락을 감지했습니다. 모터, 위상 케이블 및 인버터 배선을 점검하십시오. 이것은 하드웨어 문제입니다.", en: "⚠️ <b>Error: Traction inverter rear short circuit</b><br>✅ Action: Inverter has detected a short circuit on one of the phases (fault code 10/11/12/13/14/15) Check the wiring of the motor, phase cables and inverter. This is a hardware problem. Refer to appropriate diagnostic tools and supplier (troubleshooting manual for more information on this fault. The in a severe problem, inspect the inverter before using it again" },
  "437": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 인버터 브리지 오류</b><br>✅ 조치: 인버터가 동시에 동일한 위상의 두 브리지를 닫았습니다. 인버터 사용을 중지하고 모터 및 배선을 점검하십시오.", en: "⚠️ <b>Error: Traction inverter rear inverter bridge error </b><br>✅ Action: The inverter closed both bridges of the same phase at the same time. Stop using the inverter (fault code 9). Check the wiring of the motor, phase cables and inverter. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault. This may be a serious fault, inspect the inverter before using it again" },
  "438": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 인버터 과열</b><br>✅ 조치: 인버터가 설정된 최대값을 초과하는 IGBT 온도를 측정했습니다. 인버터 온도, 냉각수 상태를 점검하고 식히십시오.", en: "⚠️ <b>Error: Traction inverter rear inverter overtemperature</b><br>✅ Action: The inverter has measured an (GBT temperature higher than the set maximum value in the parameters (fault code 34). Check the inverter temperature, coolant level and fluid circulation, and allow the system to cool down Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "439": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 소프트웨어 과전류</b><br>✅ 조치: 인버터가 매개변수에 설정된 최대값보다 높은 전류를 위상에서 측정했습니다. 시스템 동작과 배선을 점검하십시오.", en: "⚠️ <b>Error: Traction inverter rear software overcurrent</b><br>✅ Action: The inverter has measured a current on one of the phases that is higher than the maximum value set in the parameters (fault code 27. )Check the system behaviour, wiring and system functionality. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on the fault" },
  "440": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 과속</b><br>✅ 조치: 인버터가 매개변수에 설정된 최대값보다 높거나 낮은 모터 속도를 측정했습니다. 진단 도구 및 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Traction inverter rear overspeed</b><br>✅ Action: The inverter has measured a speed on the motor that is higher or lower than the art maximum values in the parameters (error code 30). Refer to appropriate diagnostic tools and suppliers (troubleshooting) manual for mure Information on this fault" },
  "441": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 과주파수</b><br>✅ 조치: 인버터 출력 주파수가 매개변수에 설정된 한계를 초과합니다. 진단 도구를 참조하십시오.", en: "⚠️ <b>Error: Traction inverter rear overfrequency</b><br>✅ Action: The inverter output frequency is higher than the limit set in the parameters (fault code 61). Refer to appropriate diagnostic tools and supplier's troubleshooting manual for more information thes fautt" },
  "442": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 결상</b><br>✅ 조치: 출력 위상 중 하나에서 전류가 다른 위상보다 현저히 낮습니다. 배선을 점검하고 전원 케이블 연결 상태를 확인하십시오.", en: "⚠️ <b>Error: Traction inverter rear phase loss</b><br>✅ Action: The inverter has measured a current on one of the output phases that is significantly lower than an the athes phases (fault code 63). Check the wing, possibly one of the power cables is no longer connected Refer to appropriate diagnostic tools and supplier's (troubleshooting maual for more information loss this fault." },
  "443": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 접지 오류</b><br>✅ 조치: 인버터 총 출력 전류가 설정된 최대값을 초과했습니다. 진단 도구 및 매뉴얼을 참조하십시오.", en: "⚠️ <b>Error: Traction inverter rear earth error</b><br>✅ Action: The inverter has total output current higher than the maximum value set in the parameters (error code 62). Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on the ." },
  "444": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 병렬 통신 오류</b><br>✅ 조치: 인버터 SYNC 링크에 오류가 발생했습니다. SYNC 링크 배선 차폐 및 접지를 점검하십시오.", en: "⚠️ <b>Error: Traction inverter rear parallel communication error</b><br>✅ Action: The inverter SYNC link has gone into error (error code 86). Check the SYNC link wiring shielding and earthing of the system. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this fault" },
  "445": { ko: "⚠️ <b>오류: 트랙션 인버터 후면 리졸버 오류</b><br>✅ 조치: 인버터가 리졸버에서 오류를 감지했습니다. 리졸버 배선을 점검하고 센서를 다시 보정하십시오.", en: "⚠️ <b>Error: Traction inverter rear resolver error</b><br>✅ Action: The inverter detects an error on the resolver (error code 163) Check resolver wiring, ses parameters and calibrate the sensor again. Refer to appropiate diagnostic tools and supplier troubleshooting manual for me Information on this fault" },
  "490": { ko: "⚠️ <b>오류: 배터리 종료 시간 초과</b><br>✅ 조치: 메인 스위 차단 후 지정된 시간 내에 배터리가 꺼지지 않았습니다. 시스템 전류가 너무 높았는지 확인하십시오.", en: "⚠️ <b>Error: Battery shutdown timeout</b><br>✅ Action: The battery could not be switched off within the specified time after the main switch of mass switch has been shut down. The system current was too high. Check why the system current is/was too high" },
  "494": { ko: "⚠️ <b>오류: 배터리 SOC(충전 상태) 매우 낮음</b><br>✅ 조치: 배터리 SOC가 너무 낮습니다. 방전 전력이 0%로 감소합니다. AGV를 회수하여 충전하십시오. 수동 주행이 불가능합니다.", en: "⚠️ <b>Error: Battery SOC too low</b><br>✅ Action: The battery SOC is too low. The battery discharge power is reduced to 0% of the orginal capacity. Recover the AGV and charge the battery. Manual driving is not possible anymore at this point. Refer to appropriate diagnostic tools and supplier troubleshooting) manual for more information on this fault" },
  "495": { ko: "⚠️ <b>오류: 배터리 SOC(충전 상태) 낮음</b><br>✅ 조치: 배터리 SOC가 너무 낮습니다. 방전 전력이 50%로 감소합니다. AGV를 회수하여 충전하십시오.", en: "⚠️ <b>Error: Battery SOC low</b><br>✅ Action: The battery SOC too low. The battery discharge power is reduced to 50% of the orginal capacity, Recover the AGV and charge the battery. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more Information on this fault" },
  "496": { ko: "⚠️ <b>오류: 배터리 메인 접촉기 1 닫힘 상태 고착</b><br>✅ 조치: BMS가 메인 접촉기 1이 열려야 함에도 닫혀 있다는 피드백을 수신했습니다. 전원 공급 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: Battery main contactor 1 stuck closed</b><br>✅ Action: The BMS receives feedback of main contactor 1 that it is closed, but it should be open. Check the power supply and functioning of the module. Refer to appropriate diagnostic tools and supplier (troubleshooting manual for more information on this fault." },
  "497": { ko: "⚠️ <b>오류: 배터리 메인 접촉기 2 닫힘 상태 고착</b><br>✅ 조치: BMS가 메인 접촉기 2가 열려야 함에도 닫혀 있다는 피드백을 수신했습니다. 전원 공급 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: Battery main contactor 2 stuck closed</b><br>✅ Action: The BMS receives feedback of main contactor 2 that it is closed, but it should be open. Check the power supply and functioning of the module. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this fault" },

  "499": { ko: "⚠️ <b>오류: 배터리 메인 접촉기 4 닫힘 상태 고착</b><br>✅ 조치: BMS가 메인 접촉기 4가 열려야 함에도 닫혀 있다는 피드백을 수신했습니다. 전원 공급 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: Battery main contactor 4 stuck closed</b><br>✅ Action: The BMS receives feedback of main contactor that it is closed, but it should be open. Check the power supply and functioning of the module. Refer to appropriate diagnostic tools and supplier troubleshooting) manual for more information on this fault" },
  "500": { ko: "⚠️ <b>오류: 배터리 스트링 1 작동 안 함</b><br>✅ 조치: 오류로 인해 BMS가 배터리 스트링 1을 비활성화했습니다. 분석을 위해 적절한 진단 도구를 참조하십시오.", en: "⚠️ <b>Error: Battery string 1 does not work</b><br>✅ Action: Battery string has been disabled by the BMS due to an error. Refer to appropriate diagnostic tools provided by the supplier for analysis on this fault," },

  "503": { ko: "⚠️ <b>오류: 배터리 스트링 4 작동 안 함</b><br>✅ 조치: 오류로 인해 BMS가 배터리 스트링 4를 비활성화했습니다. 분석을 위해 적절한 진단 도구를 참조하십시오.", en: "⚠️ <b>Error: Battery string 4 does not work</b><br>✅ Action: Battery string 4 has been disabled by the BMS due to an error. Refer to appropriate diagnostic tools provided by the supplier for analysis on this fault" },
  "504": { ko: "⚠️ <b>오류: 배터리 셀 전압 너무 높음(위험)</b><br>✅ 조치: 배터리 시스템이 종료되며 충전 전력이 0%로 제한됩니다. 안전한 수준으로 배터리를 방전하십시오.", en: "⚠️ <b>Error: Battery cell voltage too high critical</b><br>✅ Action: The battery cell voltage is too high. The battery system will shutdown. The battery charge power is limited to 0% Discharge the batteries to a safe level. Refer to appropriate diagnostic tools and supplier troubleshooting manual for more information on this fault" },

  "506": { ko: "⚠️ <b>오류: 배터리 셀 전압 높음</b><br>✅ 조치: 배터리 충전 전력이 50%로 제한되며 충전 세션이 활성화된 경우 종료됩니다. 안전한 수준으로 방전하십시오.", en: "⚠️ <b>Error: Battery cell voltage high</b><br>✅ Action: The Battery cell voltage is high. The battery charge power is limited to 50% and if there is a charge session active it will be terminated. Discharge the batteries 10 a safe level Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this fault" },
  "507": { ko: "⚠️ <b>오류: 배터리 셀 전압 너무 낮음</b><br>✅ 조치: 배터리 셀 전압이 너무 낮아 하위 시스템이 종료됩니다. 안전한 수준으로 충전하십시오.", en: "⚠️ <b>Error: Battery cell voltage too low</b><br>✅ Action: The battery cell voltage is too low The battery subsystem with this alarm will shutdown. Charge the batteries to a safe level. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this fault." },

  "509": { ko: "⚠️ <b>오류: 배터리 셀 온도 너무 높음</b><br>✅ 조치: 배터리 온도가 너무 높아 전체 배터리 시스템이 종료됩니다. 시스템을 식히고 열 폭주 여부를 점검하십시오.", en: "⚠️ <b>Error: Battery cell temperature too high</b><br>✅ Action: The battery cell temperature is too high. The battery subsystem with this alarm will shutdown of the complete battery system will shutdown. Let the hatteries cool down and check the system for a thermal runaway. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this fault" },
  "510": { ko: "⚠️ <b>오류: 배터리 셀 밸런스 차이 너무 큼</b><br>✅ 조치: 배터리 전압 차이가 너무 큽니다. 배터리 출력이 50%로 제한됩니다. 진단 도구를 참조하십시오.", en: "⚠️ <b>Error: Battery cell balance difference too high</b><br>✅ Action: The battery detected a too high cell voltage difference. Battery power is limited to 50%. Refer to appropriate diagnostic tools and supplies (troubleshooting) manual for more information on this fault" },
  "511": { ko: "⚠️ <b>오류: 배터리 셀 온도 높음</b><br>✅ 조치: 충전 전력이 50%로 제한되며 충전 세션이 종료될 수 있습니다. 시스템을 식히고 열 폭주 여부를 점검하십시오.", en: "⚠️ <b>Error: Battery cell Temperature high</b><br>✅ Action: The battery cell temperature is high. The battery charge power it limited to 50% and if there is a charge session active, it will he terminated. Let the batteries cool down and check the system for a thermal runaway. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this fault" },
  "512": { ko: "⚠️ <b>오류: 배터리 팩 전압 너무 높음</b><br>✅ 조치: 배터리가 종료됩니다. 안전한 수준으로 배터리를 방전하십시오.", en: "⚠️ <b>Error: Battery pack voltage too high</b><br>✅ Action: The battery pack voltage in too high. The battery will shutdown. Discharge the batteries to a safe level. Refer to appropriate diagmistic tools and supplier (troubleshooting) manual for more information on this faurt" },
  "513": { ko: "⚠️ <b>오류: 배터리 팩 전압 높음</b><br>✅ 조치: 충전 전력이 50%로 제한되며 충전이 종료될 수 있습니다. 안전한 수준으로 방전하십시오.", en: "⚠️ <b>Error: Battery pack voltage high</b><br>✅ Action: The battery pack voltage in high. The battery charge power is limited to 50% and if there is a charge session active, it will be terminated. Discharge the batteries to a safe level Refer to appropriate diagnostic todis and supplier (troubleshooting) manual for more information on this fault" },
  "514": { ko: "⚠️ <b>오류: 배터리 팩 전압 너무 낮음</b><br>✅ 조치: 방전 전력이 0%로 제한되고 하위 시스템이 종료됩니다. 안전한 수준으로 방전/충전하십시오.", en: "⚠️ <b>Error: Battery pack voltage too low</b><br>✅ Action: The battery pack voltage is too low. The battery discharge power is limited to 0% and the battery subsystem with this alarm will shutdown. Discharge the batteries to a safe level Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "515": { ko: "⚠️ <b>오류: 배터리 팩 전압 낮음</b><br>✅ 조치: 방전 전력이 50%로 제한됩니다. 안전한 수준으로 방전/충전하십시오.", en: "⚠️ <b>Error: Battery pack voltage low</b><br>✅ Action: The battery pack voltage is tow. The battery discharge power is limited to 50%. Discharge the batteries to a safe level. Refer to appropriate diagnostic tools and supplier (troubleshooting) manual for more information on this fault" },
  "516": { ko: "⚠️ <b>오류: 배터리 방전 전류 너무 높음</b><br>✅ 조치: 방전 전력이 0%로 제한됩니다. 시스템 손상 및 퓨즈를 점검하십시오.", en: "⚠️ <b>Error: Battery discharge current too high</b><br>✅ Action: The battery discharge current is too high. The battery discharge power is limited to 0% Check the system for damage arid check the fuses. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "517": { ko: "⚠️ <b>오류: 배터리 방전 전류 높음</b><br>✅ 조치: 방전 전력이 50%로 제한됩니다. 시스템 손상 및 퓨즈를 점검하십시오.", en: "⚠️ <b>Error: Battery discharge current high</b><br>✅ Action: The battery discharge current is high. The battery discharge power is limited to 50%. Check the system for damage and check the fuses. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "518": { ko: "⚠️ <b>오류: 배터리 회생 전류 너무 높음</b><br>✅ 조치: 충전 전력이 0%로 제한됩니다. 시스템 손상 및 퓨즈를 점검하십시오.", en: "⚠️ <b>Error: Battery regenerative current too high</b><br>✅ Action: The Battery regenerative current is too high. The battery charge power is limited to 0% Check the system for damage and check the fuses. Refer to appropriate diagnostic tools and supplier's (troubleshooting manual for more information on this fault" },
  "519": { ko: "⚠️ <b>오류: 배터리 회생 전류 높음</b><br>✅ 조치: 충전 전력이 50%로 제한됩니다. 시스템 손상 및 퓨즈를 점검하십시오.", en: "⚠️ <b>Error: Battery regenerative current high</b><br>✅ Action: The battery regenerative current is high. The battery charge power in limited to 50%. Check the system for damage and check the fuses. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "520": { ko: "⚠️ <b>오류: 배터리 충전 전류 너무 높음</b><br>✅ 조치: 충전 전력이 0%로 제한됩니다. 시스템 손상 및 퓨즈를 점검하십시오.", en: "⚠️ <b>Error: Battery charge current too high</b><br>✅ Action: The battery charge current is too high. The battery charge power is limited to 0%. Check the system for damage and check the fuses. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for m information ein this fault" },
  "521": { ko: "⚠️ <b>오류: 배터리 충전 전류 높음</b><br>✅ 조치: 충전 전력이 50%로 제한됩니다. 시스템 손상 및 퓨즈를 점검하십시오.", en: "⚠️ <b>Error: Battery charge current high</b><br>✅ Action: The battery charge current is high. The battery charge power is limited to 50%. Check the system for damage and check the fuses. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for mare information on this fault." },
  "522": { ko: "⚠️ <b>오류: 배터리 셀 온도 차이 높음</b><br>✅ 조치: 배터리 셀 온도 차이가 너무 큽니다. 출력이 50%로 제한됩니다.", en: "⚠️ <b>Error: Battery cell temperature difference high</b><br>✅ Action: The battery cell temperature difference is too high. The battery power is limited to 50%. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "523": { ko: "⚠️ <b>오류: 배터리 HV(고전압) 연결 오류</b><br>✅ 조치: 배터리 스트링 간 전류 부하 불균형이 있습니다. HV 케이블의 손상 및 연결 상태를 점검하십시오.", en: "⚠️ <b>Error: Battery HV connection error</b><br>✅ Action: There is an uneven current load balance between the battery strings. The battery power is limited to the respective amount of available battery packs. Check the HV cabling for damage and if all connections are good. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "524": { ko: "⚠️ <b>오류: 배터리 MMU SBMU 통신 오류</b><br>✅ 조치: 내부 배터리 통신 결함이 있습니다. 배터리 시스템의 CAN 버스, 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: Battery MMU SBMU communication error</b><br>✅ Action: There is an internal battery communication fault between a MMU and SBMU. The battery power a limited to the respective amount of available battery packs. Check the CAN bus (quality), wiring and functioning of the components in the battery system. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "525": { ko: "⚠️ <b>오류: 배터리 SBMU MBMU 통신 오류</b><br>✅ 조치: SBMU와 MBMU 간의 내부 통신 결함입니다. CAN 버스, 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: Battery SBMU MBMU communication error</b><br>✅ Action: There is an internal battery communication fault between a SBMU and the MBMU. The battery power is limited to the respective amount of available battery packs. Check the CAN bus (quality), wiring and functioning of the components in the battery system. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "526": { ko: "⚠️ <b>오류: 배터리 VCU MBMU 통신 오류</b><br>✅ 조치: MBMU와 VCU 간의 통신 결함으로 인해 배터리가 종료됩니다. CAN 버스, 배선 및 구성 요소 기능을 점검하십시오.", en: "⚠️ <b>Error: Battery VCU MBMU communication error</b><br>✅ Action: There is an communication fault between the MBMU and VCU. The battery will shutdown. Check the CAN bus (quality), wining and functioning of the components. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "527": { ko: "⚠️ <b>오류: 배터리 BTMS 오류</b><br>✅ 조치: BTMS가 BMS에 심각한 오류를 보고했거나 통신 오류가 있습니다. 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: Battery BTMS error</b><br>✅ Action: The BTMS report a severe error to the BMS or there is a communication error. Check the functioning of the module. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "528": { ko: "⚠️ <b>오류: 배터리 절연 오류</b><br>✅ 조치: 배터리 시스템의 절연 값이 너무 낮아 배터리가 종료됩니다. AGV 사용을 중지하고 모든 600V 시스템을 끄십시오. 전기 전문가에게 모든 시스템의 절연 검사를 의뢰하십시오.", en: "⚠️ <b>Error: Battery isolation error</b><br>✅ Action: A battery system measures a too low insulation value. The battery will shutdown. Do not use the AGV and switch off all 600V systems. Have an electrical specialist check the insulation value of all AGV (600V) systems Also check the system for damage Repair the system and replace any defective components." },
  "530": { ko: "⚠️ <b>오류: BTMS 600VDC 전원 공급 저전압</b><br>✅ 조치: BTMS가 600V 전원 출력에서 저전압을 감지했습니다. 전원 공급 장치를 점검하십시오.", en: "⚠️ <b>Error: BTMS 600VDC supply undervoltage</b><br>✅ Action: The BTMS detects an undervoltage on the 600V power output. Check the power supply Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "531": { ko: "⚠️ <b>오류: BTMS 600VDC 전원 공급 과전압</b><br>✅ 조치: BTMS가 600V 전원 공급에서 과전압을 감지했습니다. 전원 공급 장치를 점검하십시오.", en: "⚠️ <b>Error: BTMS 600VDC supply overvoltage</b><br>✅ Action: The BTMS detects an overvoltage on the 600V power supply. Check the power supply, Refer to appropriate diagnostic tools and supplier's troubleshooting manual for more information on this fault" },
  "532": { ko: "⚠️ <b>오류: BTMS 24VDC 전원 공급 저전압</b><br>✅ 조치: BTMS가 24V 전원 공급에서 저전압을 감지했습니다. 전원 공급 장치를 점검하십시오.", en: "⚠️ <b>Error: BTMS 24VDC supply undervoltage</b><br>✅ Action: The BTMS detects an undervoltage on the 24V power supply. Check the power supply. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault. The BTMS detects an undervoltage on the 24V power supply. Check the power supply" },
  "533": { ko: "⚠️ <b>오류: BTMS 24VDC 전원 공급 과전압</b><br>✅ 조치: BTMS가 24V 전원 공급에서 과전압을 감지했습니다. 전원 공급 장치를 점검하십시오.", en: "⚠️ <b>Error: BTMS 24VDC supply overvoltage</b><br>✅ Action: The BTMS detects an overvoltage on the 24V power supply. Check the power supply. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "534": { ko: "⚠️ <b>오류: BTMS 압축기 오류</b><br>✅ 조치: BTMS가 압축기에서 결함을 감지했습니다. 모듈의 전원 공급 및 기능을 점검하고 AGV를 재시작하십시오.", en: "⚠️ <b>Error: BTMS compressor error</b><br>✅ Action: The BTMS detects a fault with the compressor. Check power supply and functionality of the module Restart the AGV. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "535": { ko: "⚠️ <b>오류: BTMS 워터 펌프 오류</b><br>✅ 조치: BTMS가 워터 펌프에서 오류를 감지했습니다. 모듈의 전원 공급 및 기능을 점검하십시오.", en: "⚠️ <b>Error: BTMS water pump error</b><br>✅ Action: The BTMS detects an error with the water pump. Check the power supply and functionality of the module. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "536": { ko: "⚠️ <b>오류: BTMS 냉각 시스템 압력 오류</b><br>✅ 조치: BTMS가 냉각 시스템에서 원치 않는 압력을 감지했습니다. 가스 압력을 확인하고 필요시 수정하십시오.", en: "⚠️ <b>Error: BTMS cooling system pressure error</b><br>✅ Action: The BTMS detects an unwanted pressure on the cooling system. Check the gas pressure anit correct if necessary Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "537": { ko: "⚠️ <b>오류: BTMS 제상 센서 오류</b><br>✅ 조치: BTMS가 제상 센서에서 결함을 감지했습니다. 전원 공급 및 모듈 기능을 점검하고 AGV를 재시작하십시오.", en: "⚠️ <b>Error: BTMS sensor defrost error</b><br>✅ Action: The BTMS detects a fault on the defrost sensor. Check power supply and functionality of the module Restart the AGV Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault" },
  "538": { ko: "⚠️ <b>오류: BTMS CAN 통신 오류</b><br>✅ 조치: 시작 후 VCU에서 CAN 제어 보고서를 수신하지 못했습니다. CAN 버스, 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: BTMS CAN communication error</b><br>✅ Action: The BTMS did not receive CAN control report from the VCU after start-up. Check the CAN bus (quality), wiring and functioning of the modules. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault." },
  "539": { ko: "⚠️ <b>오류: BTMS 유출 냉각수 온도 센서 오류</b><br>✅ 조치: 유출 냉각수 온도 센서에서 오류를 감지했습니다. 모듈의 전원 공급 및 기능을 점검하십시오.", en: "⚠️ <b>Error: BTMS sensor temperature outgoing coolant error</b><br>✅ Action: The BTMS detects an error on the outgoing coolant temperature sensor. Check the power supply to and functionality of the module. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault." },
  "540": { ko: "⚠️ <b>오류: BTMS 유입 냉각수 온도 센서 오류</b><br>✅ 조치: 유입 냉각수 온도 센서에서 오류를 감지했습니다. 전원 공급 및 모듈 기능을 점검하고 AGV를 재시작하십시오.", en: "⚠️ <b>Error: BTMS sensor temperature incoming coolant error</b><br>✅ Action: BTMS detects an error with the input coolant temperature sensor. Check power supply and functionality of the module. Restart the AGV. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault." },
  "541": { ko: "⚠️ <b>오류: BTMS 냉각수 수위 낮음</b><br>✅ 조치: BTMS가 낮은 냉각수 수위를 감지했습니다. 적절한 냉각수로 탱크를 최대 수위까지 채우십시오.", en: "⚠️ <b>Error: BTMS coolant level low</b><br>✅ Action: The BTMS detects a low coolant level. Top up the tank to maximum level with suitable coolant. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault." },
  "542": { ko: "⚠️ <b>오류: BTMS PTC 또는 히터 오류</b><br>✅ 조치: BTMS가 PTC 히터의 비정상적인 기능을 감지했습니다. 모듈의 전원 공급 및 기능을 점검하십시오.", en: "⚠️ <b>Error: BTMS PTC or heater error</b><br>✅ Action: The BTMS detects an abnormal function of the PTC heater. Check the power supply and functionality of the module. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault." },
  "543": { ko: "⚠️ <b>오류: BTMS 팬 오류</b><br>✅ 조치: BTMS가 팬에서 결함을 감지했습니다. 모듈의 전원 공급 및 기능을 점검하십시오.", en: "⚠️ <b>Error: BTMS fan error</b><br>✅ Action: The BTMS detects a fault with the fan. Check the power supply and functionality of the module. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault." },
  "544": { ko: "⚠️ <b>오류: BTMS 릴레이 본딩 오류</b><br>✅ 조치: 전원 공급 릴레이 폐쇄에 결함이 감지되었습니다. 모듈의 전원 공급 및 기능을 점검하십시오.", en: "⚠️ <b>Error: BTMS relay bonding error</b><br>✅ Action: The BTMS detects a fault with closing the power supply relay. Check the power supply and functionality of the module. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault." },
  "545": { ko: "⚠️ <b>오류: BTMS PTC CAN 통신 오류</b><br>✅ 조치: BTMS가 PTC 장치와의 통신 결함을 감지했습니다. 모듈의 전원 공급 및 기능을 점검하십시오.", en: "⚠️ <b>Error: BTMS PTC CAN communication error</b><br>✅ Action: The BTMS detects a communication fault with the PTC unit. Check the power supply and functionality of the module. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault." },
  "546": { ko: "⚠️ <b>오류: BTMS 압축기 CAN 통신 오류</b><br>✅ 조치: 압축기 장치와의 통신 결함을 감지했습니다. 모듈의 전원 공급 및 기능을 점검하십시오.", en: "⚠️ <b>Error: BTMS CMP CAN communication error</b><br>✅ Action: The BTMS detects a communication fault with the compressor unit. Check the power supply and functionality of the module. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault." },
  "547": { ko: "⚠️ <b>오류: BTMS 동결 감지</b><br>✅ 조치: BTMS가 낮은 냉각수 온도를 감지했습니다. 냉각수 온도를 확인하십시오.", en: "⚠️ <b>Error: BTMS freezing protection</b><br>✅ Action: The BTMS detects a low coolant temperature. Check the coolant temperature. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault." },
  "548": { ko: "⚠️ <b>오류: BTMS 배기 온도 센서 오류</b><br>✅ 조치: 배기 온도가 너무 높습니다. 냉각수 온도, 수위 및 유체 순환을 점검하십시오.", en: "⚠️ <b>Error: BTMS sensor temperature exhaust error</b><br>✅ Action: BTMS exhaust temperature is too high. Check cooling water temperature, level and fluid circulation. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault." },
  "549": { ko: "⚠️ <b>오류: BTMS 배기 온도 보호</b><br>✅ 조치: 배출구 온도가 보호 상태에 진입하여 시스템이 종료되었습니다. 냉각수 온도, 수위 등을 점검하고 AGV를 재시작하십시오.", en: "⚠️ <b>Error: BTMS exhaust temperature protection</b><br>✅ Action: The BTMS outlet temperature is protected. The system is shut down. Check cooling water temperature, level and fluid circulation. Restart the AGV. Refer to appropriate diagnostic tools and supplier's (troubleshooting) manual for more information on this fault." },

  "601": { ko: "⚠️ <b>오류: 퓨즈 FC40 유압 냉각 팬 불량</b><br>✅ 조치: 퓨즈의 피드백이 더 이상 활성화되지 않음을 나타냅니다. 퓨즈 뒤의 시스템, 배선 및 퓨즈 자체에 손상이나 기능 이상이 없는지 점검하십시오.", en: "⚠️ <b>Error: Fuse FC40 hydraulic oil cooling fan NOK</b><br>✅ Action: The feedback from the fuse indicates that it is no longer active. Check the wiring, the systems behind the fuse, and the fuse itself, for damage and functionality." },
  "612": { ko: "⚠️ <b>오류: AGV 충전 준비 시간 초과</b><br>✅ 조치: 내비게이션 요청 후 정해진 시간 내에 AGV가 충전 준비 상태로 전환되지 않았습니다. HMI에서 이를 방해하는 다른 알람이 있는지 확인하십시오.", en: "⚠️ <b>Error: AGV timeout ready for charging</b><br>✅ Action: The AGV failed to go into ready for charging state in time after the navigation requested this. Check the HMI for alarms that could prevent the AGV going into ready for charge state." },
  "613": { ko: "⚠️ <b>오류: 충전 플러그가 연결되었으나 CP 신호가 유효하지 않음</b><br>✅ 조치: AGV가 충전을 시작하려고 하지만 CP 신호가 유효하지 않습니다. CAN 버스, 배선, 모듈 및 CP 신호의 기능을 점검하십시오.", en: "⚠️ <b>Error: Charging plug present but CP signal invalid</b><br>✅ Action: The AGV wants to start charging, but the CP signal is invalid. Check the CAN bus (quality), wiring and functioning of the module and CP signal." },
  "614": { ko: "⚠️ <b>오류: 유효하지 않은 CP 신호로 인해 충전 중지</b><br>✅ 조치: 충전 중 유효하지 않은 CP 신호가 감지되었습니다. CAN 버스, 배선, 모듈 및 CP 신호의 기능을 점검하십시오.", en: "⚠️ <b>Error: Charging stopped CP signal invalid during charging</b><br>✅ Action: There is an invalid CP signal detected during charging. Check the CAN bus (quality), wiring and functioning of the module and CP signal." },
  "615": { ko: "⚠️ <b>오류: 케이블 점검 오류로 인해 충전 중지</b><br>✅ 조치: 케이블 점검 중 오류가 발생하여 AGV가 충전 준비 시퀀스를 중단했습니다. 이 단계에서 충전기의 절연 측정 오류를 나타낼 수 있습니다. 배선, 커넥터 및 릴레이 기능을 점검하십시오.", en: "⚠️ <b>Error: Charging stopped due to cable check error</b><br>✅ Action: The AGV stopped the charging preparation sequence due to an error during the cable check. This can imply an isolation measurement error from the charger during this phase. Check the wiring, connectors and the functioning of the relays to remove the AGV's isolation monitoring from the circuit for damage and functionality." },
  "617": { ko: "⚠️ <b>오류: QCC 충전 중 AGV CCS 소켓 캐비닛 열림</b><br>✅ 조치: AGV가 QCC 충전 중에 CCS 충전 소켓 도어가 열린 것을 감지하여 충전이 중지됩니다. 도어가 닫혀 있는지 확인하고 QCC 충전 중에는 닫아두십시오.", en: "⚠️ <b>Error: AGV CCS socket cabinet opened while QCC charging</b><br>✅ Action: The AGV detected an open door of the CCS charging socket while the AGV was QCC charging. The charging session will be stopped. Check whether the door is opened and make sure to keep it closed during QCC charging. If the door is closed, check the mounting of the door sensor." },
  "618": { ko: "⚠️ <b>오류: 주행 중 AGV CCS 소켓 캐비닛 열림</b><br>✅ 조치: AGV가 주행 중이거나 주행하려는 시점에 CCS 충전 소켓 도어가 열린 것을 감지했습니다. 도어를 확인하고 닫은 후 주행하십시오.", en: "⚠️ <b>Error: AGV CCS socket cabinet opened while driving</b><br>✅ Action: The AGV detected an open door of the CCS charging socket while the AGV was driving or about to drive away. Check whether the door is opened and close it before driving. If the door is closed, check the mounting of the door sensor." },
  "619": { ko: "⚠️ <b>오류: AGV QCC PP 신호 시간 초과</b><br>✅ 조치: QCC 소켓 내부에 객체가 감지되었으나, 유효한 플러그 존재 신호가 감지되지 않았습니다. QCC 소켓과 플러그의 기능 및 손상 여부를 확인하십시오.", en: "⚠️ <b>Error: AGV QCC PP signal timeout</b><br>✅ Action: The AGV did not detect a valid plug present signal while there was an object detected inside the QCC socket. Check the QCC socket and plug for functionality and damage. Check the mounting of the QCC socket sensor and adjust if needed." },
  "620": { ko: "⚠️ <b>오류: 주행 중 QCC 충전 소켓에서 객체 감지</b><br>✅ 조치: AGV가 주행 중이거나 주행을 시작하려는 시점에 QCC 충전 소켓에서 객체를 감지했습니다. QCC 소켓 내부의 객체 및 센서 설정을 점검하십시오.", en: "⚠️ <b>Error: AGV object detected in QCC charging socket while driving</b><br>✅ Action: The AGV detected an object in QCC charging socket while it was driving or about to drive away. Check the QCC socket for objects and sensor adjustment." },
  "621": { ko: "⚠️ <b>오류: 접촉기 KF101 600VDC+ QCC 충전 피드백 오류</b><br>✅ 조치: 600VDC QCC 충전 접촉기의 피드백에 진단 결함이 있습니다. VCU에서 모듈로 가는 배선을 점검하고 결함이나 손상이 없는지 확인하십시오.", en: "⚠️ <b>Error: Contactor KF101 600VDC+ QCC charging feedback error</b><br>✅ Action: There is a diagnostics fault on feedback of the 600VDC QCC charging contactor. Check the wiring from VCU to the module and check the system for faults or damage. If not there, restart the AGV and check for recurring errors." },
  "622": { ko: "⚠️ <b>오류: 접촉기 KF102 600VDC+ CCS 충전 피드백 오류</b><br>✅ 조치: 600VDC CCS 충전 접촉기의 피드백에 진단 결함이 있습니다. VCU에서 모듈로 가는 배선을 점검하고 결함이나 손상이 없는지 확인하십시오.", en: "⚠️ <b>Error: Contactor KF102 600VDC+ CCS charging feedback error</b><br>✅ Action: There is a diagnostics fault on feedback of the 600VDC CCS charging contactor. Check the wiring from VCU to the module and check the system for faults or damage. If not there, restart the AGV and check for recurring errors." },
  "623": { ko: "⚠️ <b>오류: 접촉기 KF103 600VDC- QCC 충전 피드백 오류</b><br>✅ 조치: 600VDC- QCC 충전 접촉기의 피드백에 진단 결함이 있습니다. VCU에서 모듈로 가는 배선을 점검하고 결함이나 손상이 없는지 확인하십시오.", en: "⚠️ <b>Error: Contactor KF103 600VDC- QCC charging feedback error</b><br>✅ Action: There is a diagnostics fault on feedback of the 600VDC- QCC charging contactor. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
  "624": { ko: "⚠️ <b>오류: 접촉기 KF104 600VDC- CCS 충전 피드백 오류</b><br>✅ 조치: 600VDC- CCS 충전 접촉기의 피드백에 진단 결함이 있습니다. VCU에서 모듈로 가는 배선을 점검하고 결함이나 손상이 없는지 확인하십시오.", en: "⚠️ <b>Error: Contactor KF104 600VDC- CCS charging feedback error</b><br>✅ Action: There is a diagnostics fault on feedback of the 600VDC- CCS charging contactor. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
  "625": { ko: "⚠️ <b>오류: 접촉기 KF101 600VDC+ QCC 충전 VCU 출력 오류</b><br>✅ 조치: 600VDC QCC 충전 접촉기 제어에 진단 결함이 있습니다. 배선을 점검하고 시스템 결함이나 손상을 확인하십시오.", en: "⚠️ <b>Error: Contactor KF101 600VDC+ QCC charging VCU output error</b><br>✅ Action: There is a diagnostics fault on the control of the 600VDC QCC charging contactor. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
  "626": { ko: "⚠️ <b>오류: 접촉기 KF102 600VDC+ CCS 충전 VCU 출력 오류</b><br>✅ 조치: 600VDC CCS 충전 접촉기 제어에 진단 결함이 있습니다. 배선을 점검하고 시스템 결함이나 손상을 확인하십시오.", en: "⚠️ <b>Error: Contactor KF102 600VDC+ CCS charging VCU output error</b><br>✅ Action: There is a diagnostics fault on the control of the 600VDC CCS charging contactor. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
  "627": { ko: "⚠️ <b>오류: 접촉기 KF103 600VDC- QCC 충전 VCU 출력 오류</b><br>✅ 조치: 600VDC QCC 충전 접촉기 제어에 진단 결함이 있습니다. 배선을 점검하고 시스템 결함이나 손상을 확인하십시오.", en: "⚠️ <b>Error: Contactor KF103 600VDC- QCC charging VCU output error</b><br>✅ Action: There is a diagnostics fault on the control of the 600VDC QCC charging contactor. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
  "628": { ko: "⚠️ <b>오류: 접촉기 KF104 600VDC- CCS 충전 VCU 출력 오류</b><br>✅ 조치: 600VDC CCS 충전 접촉기 제어에 진단 결함이 있습니다. 배선을 점검하고 시스템 결함이나 손상을 확인하십시오.", en: "⚠️ <b>Error: Contactor KF104 600VDC- CCS charging VCU output error</b><br>✅ Action: There is a diagnostics fault on the control of the 600VDC CCS charging contactor. Check the wiring from VCU to the module and check the system for faults or damage. If everything is OK, restart the AGV and check for recurring errors." },
  "629": { ko: "⚠️ <b>오류: 충전기 충전 중단</b><br>✅ 조치: 충전기가 예기치 않게 충전을 중지했습니다. 충전 시스템에 오류가 없는지 점검하십시오.", en: "⚠️ <b>Error: Charger interrupted charging</b><br>✅ Action: The charger stopped charging unexpectedly. Check the charging system for any errors." },
  "630": { ko: "⚠️ <b>오류: 충전기 상태 오류</b><br>✅ 조치: 충전기가 오류 상태에 있습니다. 충전 시스템을 점검하십시오.", en: "⚠️ <b>Error: Charger state error</b><br>✅ Action: The charger is in error state. Check the charging system for any errors." },
  "631": { ko: "⚠️ <b>오류: 충전기 충전 강제종료</b><br>✅ 조치: 충전기가 예기치 않게 충전 세션을 종료하려고 합니다. 충전 시스템을 점검하십시오.", en: "⚠️ <b>Error: Charger charging shutdown</b><br>✅ Action: The charger requests to terminate the charging session unexpectedly. Check the charging system for any errors." },
  "632": { ko: "⚠️ <b>오류: 충전기 비상 정지</b><br>✅ 조치: 충전기에 활성화된 비상 정지가 있습니다. 비상 정지가 눌린 원인을 파악하고 상황이 안전해지면 초기화하십시오.", en: "⚠️ <b>Error: Charger emergency stop</b><br>✅ Action: The charger has an active emergency stop. Check the reason for pressing the emergency stop and reset when the situation is safe again." },
  "634": { ko: "⚠️ <b>오류: 충전 중 또는 충전 전 AGV 비고정</b><br>✅ 조치: 주차 브레이크가 활성화되지 않았지만 AGV가 충전 플러그를 감지하거나 충전 모드로 설정되어 있습니다. 주차 브레이크 기능을 점검하십시오.", en: "⚠️ <b>Error: AGV not immobilized during or before charging</b><br>✅ Action: The AGV park brake is not activated but the AGV detects a charging plug or is set to charge mode. Check the functioning of the park brake and reset the AGV. Retry the charging of the AGV after this." },
  "635": { ko: "⚠️ <b>오류: 유효하지 않은 상태에서 VCCU 초기화 상태로 전환</b><br>✅ 조치: 충전 컨트롤러가 유효하지 않은 상태 전환을 수행했습니다. AGV를 재설정하고 모듈 기능 및 배선을 점검하십시오.", en: "⚠️ <b>Error: VCCU to state initialize from invalid state</b><br>✅ Action: The charge controller made an invalid state transition. Reset the AGV. Check the CAN bus (quality), wiring and functioning of the modules." },
  "636": { ko: "⚠️ <b>오류: 충전기 플러그 온도 너무 높음</b><br>✅ 조치: 충전기 플러그 온도가 너무 높습니다. 플러그를 식히고 소켓이나 플러그의 손상 여부를 확인하십시오.", en: "⚠️ <b>Error: Charger plug temperature too high</b><br>✅ Action: The charger plug temperature is too high. Let the plug cool down and check for damage on the plug or socket." },
  "638": { ko: "⚠️ <b>오류: 충전 중 AGV 모드 선택 스위치 변경</b><br>✅ 조치: 충전 중 AGV 모드 스위치 상태가 변경되었습니다. 모드 스위치를 확인하고 AGV를 재설정하십시오.", en: "⚠️ <b>Error: AGV mode selector switch changed during charging</b><br>✅ Action: The AGV mode switch mode state changed during charging. Check the mode switch and reset the AGV." },
  "639": { ko: "⚠️ <b>오류: VCCU 상태 오류</b><br>✅ 조치: 충전 컨트롤러가 오류 상태에 있습니다. CAN 버스 품질, 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: VCCU state error</b><br>✅ Action: The charge controller is in error state. Check the CAN bus (quality), wiring and functioning of the modules." },
  "640": { ko: "⚠️ <b>오류: QCC 충전 중 CCS 플러그 감지됨</b><br>✅ 조치: QCC 충전 중 CCS 플러그가 감지되었습니다. CCS 플러그를 제거하고 커버를 장착하십시오. 충전 시스템 손상 여부를 점검하십시오.", en: "⚠️ <b>Error: AGV detected CCS plug while QCC charging</b><br>✅ Action: The AGV detected a CCS plug while it was QCC charging. Remove the CCS plug and mount the CCS covers in the CCS socket. Check the AGV charge system and charger(s) for damage. Restart the QCC charging." },
  "641": { ko: "⚠️ <b>오류: AGV CCS 플러그 잠금 해제 시간 초과</b><br>✅ 조치: AGV가 CCS 플러그 잠금을 해제하지 못했습니다. 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: AGV CCS plug unlocking timeout</b><br>✅ Action: The AGV failed to unlock the CCS plug. Check the wiring and functioning of the module." },
  "642": { ko: "⚠️ <b>오류: AGV CCS 플러그 잠금 시간 초과</b><br>✅ 조치: AGV가 CCS 플러그를 잠그지 못했습니다. 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: AGV CCS plug locking timeout</b><br>✅ Action: The AGV failed to lock the CCS plug. Check the wiring and functioning of the module." },
  "643": { ko: "⚠️ <b>오류: AGV CCS 플러그 잠금 오류</b><br>✅ 조치: CCS 플러그 잠금 모터가 오류 상태에 있습니다. 배선 및 모듈 기능을 점검하십시오.", en: "⚠️ <b>Error: AGV CCS plug locking error</b><br>✅ Action: The CCS plug lock motor is in an error state. Check the wiring and functioning of the module." },
  "644": { ko: "⚠️ <b>오류: 접촉기 KF101 600VDC+ QCC 충전 중 상태 변경됨</b><br>✅ 조치: 충전 중 접촉기 KF101 상태가 변경되었습니다. 심각한 하드웨어 문제나 배선 문제를 나타낼 수 있으므로 점검하십시오.", en: "⚠️ <b>Error: Contactor KF101 600VDC+ QCC charging state changed during charging</b><br>✅ Action: The contactor KF101 state has changed during charging. This can indicate a serious hardware problem or wiring issue. Check the contactor for damage, functioning and check the wiring." },
  "645": { ko: "⚠️ <b>오류: 접촉기 KF102 600VDC+ CCS 충전 중 상태 변경됨</b><br>✅ 조치: 충전 중 접촉기 KF102 상태가 변경되었습니다. 심각한 하드웨어 문제나 배선 문제를 나타낼 수 있으므로 점검하십시오.", en: "⚠️ <b>Error: Contactor KF102 600VDC+ CCS charging state changed during charging</b><br>✅ Action: The contactor KF102 state has changed during charging. This can indicate a serious hardware problem or wiring issue. Check the contactor for damage, functioning and check the wiring." },
  "646": { ko: "⚠️ <b>오류: 접촉기 KF103 600VDC- QCC 충전 중 상태 변경됨</b><br>✅ 조치: 충전 중 접촉기 KF103 상태가 변경되었습니다. 심각한 하드웨어 문제나 배선 문제를 나타낼 수 있으므로 점검하십시오.", en: "⚠️ <b>Error: Contactor KF103 600VDC- QCC charging state changed during charging</b><br>✅ Action: The contactor KF103 state has changed during charging. This can indicate a serious hardware problem or wiring issue. Check the contactor for damage, functioning and check the wiring." },
  "647": { ko: "⚠️ <b>오류: 접촉기 KF104 600VDC- CCS 충전 중 상태 변경됨</b><br>✅ 조치: 충전 중 접촉기 KF104 상태가 변경되었습니다. 심각한 하드웨어 문제나 배선 문제를 나타낼 수 있으므로 점검하십시오.", en: "⚠️ <b>Error: Contactor KF104 600VDC- CCS charging state changed during charging</b><br>✅ Action: The contactor KF104 state has changed during charging. This can indicate a serious hardware problem or wiring issue. Check the contactor for damage, functioning and check the wiring." },
  "648": { ko: "⚠️ <b>오류: 전원 DC/DC 피드백 오류</b><br>✅ 조치: 24V DC/DC 전원 공급 장치 중 하나가 더 이상 제대로 작동하지 않으며 OK 신호가 활성화되지 않습니다. 결함이 있는 것을 교체하십시오.", en: "⚠️ <b>Error: Power supply DC/DC feedback error</b><br>✅ Action: One of the 24V DC/DC power supplies is no longer working properly, the OK signal is no longer active. Check the power supplies and replace the faulty one(s)." },
  "649": { ko: "⚠️ <b>오류: 오류로 인해 AGV 충전 중지됨</b><br>✅ 조치: 충전 중 발생한 심각한 오류로 인해 AGV가 충전을 중단했습니다. 오류의 원인을 분석하고 다른 알람이 활성화되었는지 확인하십시오.", en: "⚠️ <b>Error: AGV charging stopped due to error</b><br>✅ Action: The AGV stopped its charging session because of a critical error that occurred during charging. Analyse the cause of the error. Check if other alarms are active." },
  "650": { ko: "⚠️ <b>오류: 배터리 스트링 불균형</b><br>✅ 조치: 배터리 스트링 사이에 불균형이 있습니다. 현재 작업을 마친 후 AGV를 충전기로 보내십시오. 충전 시 배터리가 자동으로 균형을 맞춥니다.", en: "⚠️ <b>Error: Battery string unbalance</b><br>✅ Action: There is an imbalance between the battery strings. Let the AGV finish its current work order and after that, send the AGV to the charger. The AGV will automatically balance its battery strings during charging. Should this not be automatic; refer to appropriate diagnostic tools and (troubleshooting) supplier's manual for more information on the status of each battery string and try to manually balance the strings." }
    };

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + lang).classList.add('active');
        document.getElementById('title').innerText = uiText[lang].title;
        document.getElementById('search-text').innerText = uiText[lang].search;
        document.getElementById('errorCode').placeholder = uiText[lang].placeholder;
        document.getElementById('footer-text').innerText = uiText[lang].footer;
        
        const codeValue = document.getElementById('errorCode').value;
        if (codeValue) {
            check();
        } else {
            const resultDiv = document.getElementById('result');
            if(resultDiv.innerText.includes("💡") || resultDiv.innerText.includes("❌")) {
                resultDiv.innerText = uiText[lang].empty;
            }
        }
    }

    function getNumbers(count, end) {
        let nums = [];
        while (nums.length < count) {
            let r = Math.floor(Math.random() * end) + 1;
            if (!nums.includes(r)) nums.push(r);
        }
        return nums.sort((a, b) => a - b);
    }

    function getBallColor(num) {
        if (num <= 10) return "#ffd600"; 
        if (num <= 20) return "#3b82f6"; 
        if (num <= 30) return "#ef4444"; 
        if (num <= 40) return "#64748b"; 
        return "#10b981"; 
    }

    function makeBall(num, isStar = false) {
        const color = isStar ? "#f59e0b" : getBallColor(num);
        const textColor = (isStar || (!isStar && num <= 10)) ? "#1e293b" : "white";
        return `<span class="lotto-ball" style="background:${color}; color:${textColor};">${num}</span>`;
    }

    function check() {
        const codeInput = document.getElementById('errorCode');
        codeInput.blur();
        const code = codeInput.value;
        const resultDiv = document.getElementById('result');
        
        if (!code) { resultDiv.innerText = uiText[currentLang].empty; return; }

        if (code === "777") {
            let output = uiText[currentLang].lottoTitle;
            for (let i = 0; i < 5; i++) {
                output += `<div class="lotto-row">`;
                if (currentLang === 'ko') {
                    const nums = getNumbers(6, 45);
                    nums.forEach(n => output += makeBall(n));
                } else {
                    const mainNums = getNumbers(5, 50);
                    const starNums = getNumbers(2, 12);
                    mainNums.forEach(n => output += makeBall(n));
                    output += `<span class="plus-sign">+</span>`;
                    starNums.forEach(n => output += makeBall(n, true));
                }
                output += `</div>`;
            }
            resultDiv.innerHTML = output;

        } else if (code === "720") {
     
            if (currentLang === 'en') {
                resultDiv.innerText = uiText['en'].unknown;
                return;
            }

            let output = uiText['ko'].pensionTitle;
            output += `<div class="lotto-row" style="padding: 10px;">`;
            output += `<span style="font-weight: bold; color: #f8fafc; margin-right: 10px; font-size: 1.1rem;">각조</span>`;
            
       
            const pensionColors = ["#ef4444", "#f97316", "#eab308", "#3b82f6", "#a855f7", "#64748b"];
            for (let i = 0; i < 6; i++) {
           
                let r = Math.floor(Math.random() * 10);
              
                let textColor = (i === 2) ? "#1e293b" : "white";
                output += `<span class="lotto-ball" style="background:${pensionColors[i]}; color:${textColor};">${r}</span>`;
            }
            output += `</div>`;
            resultDiv.innerHTML = output;

        } else if (agvData[code]) {
            let text = agvData[code][currentLang];
            let styledText = text.replace("✅", "<br><br>✅"); 
            resultDiv.innerHTML = styledText;

        } else {
            resultDiv.innerText = uiText[currentLang].unknown;
        }
    }
</script>
